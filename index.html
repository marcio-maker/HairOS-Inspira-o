<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HairOS · Landing Page</title>
  <style>
    /* ===== IMPORTS ===== */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap');

    /* ===== RESET & VARIÁVEIS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0808;
      --bg-card: #1a1612;
      --text: #f0ebe4;
      --text-sec: #d4c9bc;
      --text-muted: #8a8278;
      --gold: #c9a96e;
      --gold-light: #e8d5a8;
      --gold-glow: rgba(201, 169, 110, .12);
      --border: rgba(201, 169, 110, .08);
      --radius: 14px;
      --transition: .4s cubic-bezier(.25, .46, .45, .94);
      --t6: .6s cubic-bezier(.23, 1, .32, 1);
    }

    html,
    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: opacity var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }

    .brand:hover {
      opacity: .7;
    }

    .brand span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: .6rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 300;
      padding-left: 2px;
      opacity: 0.6;
    }

    .brand-sub .highlight {
      color: var(--gold);
      opacity: 1;
    }

    /* ===== HEADER ACTIONS ===== */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-link {
      font-size: .7rem;
      color: var(--gold);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }

    .header-link:hover {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
    }

    /* Badge "✦ Ver Vitrine" - estilo igual ao header-link, com função de voltar */
    .vitrine-badge {
      font-size: .7rem;
      color: var(--gold);
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: all var(--transition);
    }

    .vitrine-badge.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .vitrine-badge:hover {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
    }

    .fav-btn-header {
      font-size: .75rem;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid rgba(201, 169, 110, .08);
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .fav-btn-header:hover {
      border-color: rgba(201, 169, 110, .3);
      background: rgba(201, 169, 110, .05);
    }

    .fav-btn-header .heart-icon {
      color: #ff4757;
      font-size: .9rem;
    }

    .fav-btn-header .fav-count {
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    .fav-btn-header.active {
      border-color: #ff4757;
      color: #ff4757;
      background: rgba(255, 71, 87, .08);
    }

    /* ===== FILTROS ===== */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transition: all var(--transition);
    }

    .filters.hidden {
      display: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: .75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--gold);
      color: #0a0808;
      border-color: var(--gold);
    }

    /* ===== MASONRY ===== */
    .masonry {
      column-count: 2;
      column-gap: 12px;
    }

    @media (min-width: 600px) {
      body {
        padding: 20px;
      }
      .masonry {
        column-count: 3;
        column-gap: 16px;
      }
    }

    @media (min-width: 900px) {
      .masonry {
        column-count: 4;
        column-gap: 18px;
      }
    }

    /* ===== CARDS ===== */
    .card {
      break-inside: avoid;
      margin-bottom: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      transform: translateY(0);
    }

    .card:hover {
      border-color: rgba(201, 169, 110, .35);
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      z-index: 10;
    }

    .card-img {
      width: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      transition: transform .6s cubic-bezier(.25, .46, .45, .94);
      will-change: transform;
    }

    .card:hover .card-img {
      transform: scale(1.06);
    }

    .h-sm { height: 320px; }
    .h-md { height: 380px; }
    .h-lg { height: 440px; }
    .h-xl { height: 520px; }
    .h-xxl { height: 600px; }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px);
      padding: 3px 12px;
      border-radius: 12px;
      font-size: .55rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold);
      border: 1px solid var(--gold);
      font-weight: 600;
      z-index: 5;
      transition: all var(--transition);
    }

    .card:hover .card-badge {
      background: var(--gold);
      color: #0a0808;
    }

    .badge-corte { border-color: #4ecdc4; color: #4ecdc4; }
    .badge-coloracao { border-color: #ff6b6b; color: #ff6b6b; }
    .badge-produto { border-color: #feca57; color: #feca57; }
    .badge-kit { border-color: #a29bfe; color: #a29bfe; }

    .card:hover .badge-corte { background: #4ecdc4; color: #0a0808; }
    .card:hover .badge-coloracao { background: #ff6b6b; color: #0a0808; }
    .card:hover .badge-produto { background: #feca57; color: #0a0808; }
    .card:hover .badge-kit { background: #a29bfe; color: #0a0808; }

    .card-actions-top {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 5;
      opacity: 0;
      transform: translateY(-8px);
      transition: all var(--transition);
    }

    .card:hover .card-actions-top {
      opacity: 1;
      transform: translateY(0);
    }

    .card-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .5);
      font-size: .85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .card-btn:hover {
      transform: scale(1.15);
      border-color: rgba(255, 255, 255, .3);
    }
    .card-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .25);
      border-color: rgba(255, 71, 87, .3);
    }
    .card-btn.share-btn {
      color: #4ecdc4;
    }
    .card-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    .card-action {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(10, 8, 8, .8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(201, 169, 110, .2);
      padding: 5px 14px 5px 16px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition);
      white-space: nowrap;
      opacity: 0;
    }

    .card:hover .card-action {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      border-color: var(--gold);
      background: rgba(10, 8, 8, .95);
    }

    .card-action-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .7rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .02em;
    }

    .card-action-btn {
      width: 18px;
      height: 18px;
      background: var(--gold-glow);
      border: 1px solid rgba(201, 169, 110, .3);
      border-radius: 50%;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .55rem;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .card:hover .card-action-btn {
      background: var(--gold);
      color: #0a0808;
      transform: scale(1.1);
      border-color: var(--gold);
    }

    /* ===== SECTION TITLE ===== */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: var(--text-sec);
      text-align: center;
      padding: 8px 0 4px;
      opacity: .6;
      letter-spacing: 1px;
      transition: all var(--transition);
    }

    .section-title .highlight {
      color: var(--gold);
      opacity: 1;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      column-span: all;
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: .3;
    }

    .empty-state .empty-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-sec);
      margin-bottom: 8px;
    }

    .empty-state .empty-sub {
      font-size: .85rem;
      opacity: .7;
    }

    .empty-state .empty-hint {
      margin-top: 16px;
      font-size: .75rem;
      background: var(--bg-card);
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-block;
      border: 1px solid var(--border);
    }

    /* ============================================================
       MODAL - HERO EM PROPORÇÃO 3:4 (PORTRAIT)
    ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      pointer-events: none;
      transition: background .5s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay.open {
      background: rgba(0, 0, 0, .98);
      pointer-events: auto;
    }

    .modal-overlay::-webkit-scrollbar {
      width: 4px;
    }
    .modal-overlay::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-overlay::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: var(--bg);
      border-radius: 0;
      opacity: 0;
      transition: opacity .5s ease;
      overflow: visible;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }

    .modal-overlay.open .modal-card {
      opacity: 1;
    }

    /* ===== HERO 3:4 ===== */
    .modal-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 70vh;
      overflow: hidden;
      background: var(--bg-card);
      flex-shrink: 0;
      border-radius: 0;
    }

    .modal-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      transition: opacity .4s ease;
    }

    .modal-hero-img.loading {
      opacity: 0;
    }

    .modal-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 8, 8, 0) 40%,
        rgba(10, 8, 8, 0.2) 60%,
        rgba(10, 8, 8, 0.6) 80%,
        rgba(10, 8, 8, 0.9) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .modal-hero-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
      pointer-events: none;
    }

    .modal-hero-info .hero-categoria {
      display: inline-block;
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--gold);
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px);
      padding: 2px 12px;
      border-radius: 12px;
      border: 1px solid rgba(201, 169, 110, .2);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .modal-hero-info .hero-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, .5);
    }

    .modal-hero-info .hero-sub {
      font-size: .85rem;
      color: var(--text-sec);
      opacity: .8;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .4);
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 40px;
      height: 40px;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 71, 87, .3);
      color: #ff4757;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t6);
      z-index: 30;
      pointer-events: all;
    }

    .modal-close-btn:hover {
      background: #ff4757;
      color: #fff;
      transform: scale(1.08);
    }

    .modal-hero-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 30;
      pointer-events: all;
    }

    .modal-hero-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .15);
      color: rgba(255, 255, 255, .6);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .modal-hero-btn:hover {
      transform: scale(1.1);
    }
    .modal-hero-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .2);
      border-color: rgba(255, 71, 87, .3);
    }
    .modal-hero-btn.share-btn {
      color: #4ecdc4;
    }
    .modal-hero-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    .modal-toggle-btn {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 10px 28px;
      border-radius: 30px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
      white-space: nowrap;
      pointer-events: all;
    }

    .modal-toggle-btn:hover {
      background: var(--gold);
      color: #0a0808;
      transform: translateX(-50%) scale(1.05);
    }

    .modal-toggle-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }

    /* ============================================================
       SHEET (SLIDE UP)
    ============================================================ */
    .modal-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 420px;
      margin: 0 auto;
      height: 55%;
      min-height: 300px;
      max-height: 85%;
      background: rgba(10, 8, 8, .98);
      backdrop-filter: blur(24px);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 30px;
      transform: translateY(100%);
      transition: transform var(--t6), height var(--t6);
      z-index: 150;
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(201, 169, 110, .15);
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .8);
    }

    .modal-sheet.show {
      transform: translateY(0);
    }
    .modal-sheet.full {
      height: 90%;
      border-radius: 0;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, .2);
      border-radius: 4px;
      margin: 0 auto 16px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background .3s;
    }

    .sheet-handle:hover {
      background: rgba(255, 255, 255, .4);
    }
    .sheet-handle:active {
      cursor: grabbing;
    }

    .sheet-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-right: -4px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
    }

    .sheet-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .sheet-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .sheet-scroll::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .sheet-header h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .sheet-header .sub {
      font-size: .8rem;
      color: var(--gold);
      font-weight: 400;
      margin-top: 2px;
    }

    .sheet-close-btn {
      background: rgba(255, 71, 87, .1);
      border: 1px solid rgba(255, 71, 87, .3);
      color: #ff4757;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t6);
      flex-shrink: 0;
    }

    .sheet-close-btn:hover {
      background: #ff4757;
      color: #fff;
    }

    .sheet-desc {
      font-size: .85rem;
      color: var(--text-sec);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .sheet-btns button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(201, 169, 110, .25);
      background: var(--gold-glow);
      color: var(--gold-light);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
    }

    .sheet-btns button.cuidados {
      background: rgba(46, 204, 113, .08);
      border-color: rgba(46, 204, 113, .2);
      color: #2ecc71;
    }

    .sheet-btns button:hover {
      opacity: .85;
      transform: scale(1.02);
    }

    .kit-lista {
      display: none;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: rgba(201, 169, 110, .04);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .kit-lista.show {

    // ============================================================
    // LÓGICA DA APLICAÇÃO
    // ============================================================

    function getFavs() {
      try { return JSON.parse(localStorage.getItem('hairos_favorites') || '[]'); } catch { return []; }
    }

    function setFavs(arr) {
      try { localStorage.setItem('hairos_favorites', JSON.stringify(arr)); } catch {}
    }

    let favorites = getFavs();
    let currentFilter = 'all';
    let showingFavorites = false;

    function updateFavCounter() {
      const count = favorites.length;
      document.getElementById('favCount').textContent = count;
    }
    updateFavCounter();

    function isFav(key) { return favorites.includes(key); }

    function toggleFav(key, btn) {
      favorites = isFav(key) ?
        favorites.filter(k => k !== key) :
        [...favorites, key];
      setFavs(favorites);
      updateFavCounter();
      if (btn) {
        btn.classList.toggle('favorited', isFav(key));
        btn.textContent = isFav(key) ? '♥' : '♡';
      }
    }

    function shareStyle(key) {
      const data = styleData[key];
      if (!data) return;
      const text = `${data.corte} - ${data.title}\n${data.desc}\n\nVeja mais em HairOS!`;
      if (navigator.share) {
        navigator.share({
          title: `HairOS - ${data.corte}`,
          text: text,
          url: window.location.href
        }).catch(() => {});
      } else {
        const fullText = `${text}\n${window.location.href}`;
        navigator.clipboard.writeText(fullText).then(() => {
          alert('Link copiado para compartilhar! 📋');
        }).catch(() => {
          const textarea = document.createElement('textarea');
          textarea.value = fullText;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          alert('Link copiado para compartilhar! 📋');
        });
      }
    }

    function getFilteredKeys() {
      if (showingFavorites) {
        return favorites;
      }
      const keys = Object.keys(styleData);
      if (currentFilter === 'all') return keys;
      return keys.filter(key => styleData[key].categoria === currentFilter);
    }

    // Função para voltar para a home (Inspirações)
    function goToHome() {
      if (showingFavorites) {
        showingFavorites = false;
        document.getElementById('favToggleBtn').classList.remove('active');
        document.getElementById('filters').classList.remove('hidden');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        currentFilter = 'all';
        renderMasonry();
      }
    }

    function renderMasonry() {
      const container = document.getElementById('masonry');
      const title = document.getElementById('sectionTitle');
      const vitrineBadge = document.getElementById('vitrineBadge');
      const brandSub = document.getElementById('brandSub');
      container.innerHTML = '';
      
      const filteredKeys = getFilteredKeys();

      if (showingFavorites) {
        title.innerHTML = `<span>✦</span> <span class="highlight">♥ Favoritos</span> <span>✦</span>`;
        vitrineBadge.classList.add('visible');
        brandSub.innerHTML = `✦ <span class="highlight">Vitrine de inspirações</span>`;
      } else {
        title.innerHTML = `<span>✦</span> <span class="highlight">Inspirações</span> <span>✦</span>`;
        vitrineBadge.classList.remove('visible');
        brandSub.innerHTML = `✦ <span class="highlight">Vitrine de inspirações</span>`;
      }

      if (filteredKeys.length === 0) {
        const isFavView = showingFavorites;
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${isFavView ? '💔' : '✨'}</div>
            <div class="empty-title">${isFavView ? 'Nenhum card reservado' : 'Nenhum card encontrado'}</div>
            <div class="empty-sub">${isFavView ? 'Comece a favoritar seus estilos favoritos!' : 'Tente outra categoria ou filtro'}</div>
            ${isFavView ? '<div class="empty-hint">💡 Clique no ♥ nos cards para favoritar</div>' : ''}
          </div>
        `;
        return;
      }

      filteredKeys.forEach((key) => {
        const data = styleData[key];
        if (!data) return;
        const fav = isFav(key);
        const altura = data.altura || 'h-md';

        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.key = key;
        card.dataset.categoria = data.categoria;
        card.innerHTML = `
          <div class="card-actions-top">
            <button class="card-btn share-btn" data-key="${key}" title="Compartilhar">↗</button>
            <button class="card-btn fav-btn ${fav ? 'favorited' : ''}" data-key="${key}" title="Favoritar">${fav ? '♥' : '♡'}</button>
          </div>
          <div class="card-badge badge-${data.categoria}">${data.badge}</div>
          <img class="card-img ${altura}" src="${data.img}" alt="${data.corte}" loading="lazy">
          <div class="card-action">
            <span class="card-action-title">${data.corte}</span>
            <div class="card-action-btn">→</div>
          </div>
        `;

        const favBtn = card.querySelector('.fav-btn');
        favBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleFav(this.dataset.key, this);
          if (showingFavorites) {
            renderMasonry();
          }
        });

        const shareBtn = card.querySelector('.share-btn');
        shareBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          shareStyle(this.dataset.key);
        });

        card.addEventListener('click', () => openModal(key));
        container.appendChild(card);
      });
    }

    function renderModalMasonry(key) {
      const container = document.getElementById('modalMasonry');
      container.innerHTML = '';
      
      const data = styleData[key];
      if (!data) return;

      const isProdutoKit = data.categoria === 'produto' || data.categoria === 'kit';
      document.getElementById('modalSectionTitle').textContent = isProdutoKit
        ? `✦ Itens relacionados · ${data.corte} ✦`
        : `✦ Variações ${data.corte} ✦`;

      const imgToKey = {};
      Object.keys(styleData).forEach(k => {
        const d = styleData[k];
        if (d && d.img && (d.categoria === 'produto' || d.categoria === 'kit')) {
          if (!imgToKey[d.img]) imgToKey[d.img] = k;
        }
      });

      const variants = data.variants || [data.img];
      const alturasModal = ['h-sm', 'h-md', 'h-lg', 'h-xl', 'h-xxl', 'h-md'];

      variants.forEach((imgUrl, idx) => {
        const hClass = alturasModal[idx % alturasModal.length];
        const relatedKey = imgToKey[imgUrl] || null;
        const relatedData = relatedKey ? styleData[relatedKey] : null;

        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.key = key;
        card.dataset.variant = idx;
        if (relatedKey) card.dataset.relatedKey = relatedKey;

        const label = relatedData
          ? relatedData.corte
          : (isProdutoKit ? data.corte : '');
        card.innerHTML = `
          ${label ? `<div class="card-badge badge-${relatedData ? relatedData.categoria : data.categoria}">${label}</div>` : ''}
          <img class="card-img ${hClass}" src="${imgUrl}" alt="${label || data.corte}" loading="lazy">
        `;

        card.addEventListener('click', function(e) {
          if (isSheetOpen) closeSheet();

          if (isProdutoKit && relatedKey && relatedKey !== key) {
            openModal(relatedKey);
            return;
          }

          const heroImg = document.getElementById('modalImg');
          heroImg.classList.add('loading');
          heroImg.src = imgUrl;
          heroImg.onload = () => heroImg.classList.remove('loading');

          document.getElementById('heroTitle').textContent = data.corte;
          document.getElementById('heroSub').textContent = data.title;
          document.getElementById('heroCategoria').textContent = data.badge;
          document.getElementById('modalOverlay').scrollTop = 0;
        });

        container.appendChild(card);
      });
    }

    // ============================================================
    // MODAL
    // ============================================================
    const overlay = document.getElementById('modalOverlay');
    const sheet = document.getElementById('modalSheet');
    const toggleBtn = document.getElementById('toggleSheetBtn');
    const heroFavBtn = document.getElementById('heroFavBtn');
    const heroShareBtn = document.getElementById('heroShareBtn');
    let isSheetOpen = false;
    let isSheetFull = false;
    let currentKey = null;

    function openModal(key) {
      const data = styleData[key];
      if (!data) return;
      currentKey = key;
      if (isSheetOpen) closeSheet();

      const img = document.getElementById('modalImg');
      img.classList.add('loading');
      img.src = data.img;
      img.onload = () => img.classList.remove('loading');

      document.getElementById('heroCategoria').textContent = data.badge;
      document.getElementById('heroTitle').textContent = data.corte;
      document.getElementById('heroSub').textContent = data.title;

      const isFavorited = isFav(key);
      heroFavBtn.classList.toggle('favorited', isFavorited);
      heroFavBtn.textContent = isFavorited ? '♥' : '♡';
      heroFavBtn.dataset.key = key;
      heroShareBtn.dataset.key = key;

      const toggleBtn = document.getElementById('toggleSheetBtn');
      toggleBtn.textContent = '✨ Ver Detalhes';
      toggleBtn.dataset.mode = 'sheet';
      toggleBtn.dataset.link = data.link || '#';

      document.getElementById('sheetTitle').textContent = data.corte;
      document.getElementById('sheetSub').textContent = data.title;
      document.getElementById('sheetDesc').textContent = data.desc;

      document.getElementById('coloracaoItems').innerHTML = (data.coloracao || []).map(p =>
        `<a href="${p.link}" class="kit-item" target="_blank" rel="noopener"><span>${p.name}</span><span class="ml-badge">ML</span></a>`
      ).join('');

      document.getElementById('cuidadosItems').innerHTML = (data.cuidados || []).map(p =>
        `<a href="${p.link}" class="kit-item" target="_blank" rel="noopener"><span>${p.name}</span><span class="ml-badge">ML</span></a>`
      ).join('');

      document.getElementById('listaColoracao').classList.remove('show');
      document.getElementById('listaCuidados').classList.remove('show');

      renderModalMasonry(key);

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      overlay.scrollTop = 0;
    }

    function closeModal() {
      overlay.classList.remove('open');
      if (isSheetOpen) closeSheet();
      document.body.style.overflow = '';
      currentKey = null;
    }

    function openSheet() {
      sheet.classList.add('show');
      toggleBtn.classList.add('hidden');
      isSheetOpen = true;
      sheet.classList.remove('full');
      isSheetFull = false;
    }

    function closeSheet() {
      sheet.classList.remove('show', 'full');
      toggleBtn.classList.remove('hidden');
      isSheetOpen = false;
      isSheetFull = false;
    }

    function toggleSheetFull() {
      if (!isSheetOpen) return;
      isSheetFull = !isSheetFull;
      sheet.classList.toggle('full');
    }

    // ============================================================
    // FAVORITOS TOGGLE
    // ============================================================
    const favToggleBtn = document.getElementById('favToggleBtn');

    favToggleBtn.addEventListener('click', function() {
      showingFavorites = !showingFavorites;
      this.classList.toggle('active', showingFavorites);
      
      const filters = document.getElementById('filters');
      if (showingFavorites) {
        filters.classList.add('hidden');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
      } else {
        filters.classList.remove('hidden');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        currentFilter = 'all';
      }
      
      renderMasonry();
    });

    // ============================================================
    // BADGE "✦ Ver Vitrine" - VOLTA PARA A HOME
    // ============================================================
    document.getElementById('vitrineBadge').addEventListener('click', goToHome);

    // ============================================================
    // LOGO CLICK - VOLTAR PARA HOME
    // ============================================================
    document.getElementById('brandLogo').addEventListener('click', goToHome);

    // ============================================================
    // EVENTOS
    // ============================================================
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    toggleBtn.addEventListener('click', openSheet);
    document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
    document.getElementById('sheetHandle').addEventListener('click', toggleSheetFull);

    heroFavBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const key = this.dataset.key;
      if (key) {
        toggleFav(key, this);
        if (showingFavorites) renderMasonry();
      }
    });

    heroShareBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const key = this.dataset.key;
      if (key) {
        shareStyle(key);
      }
    });

    overlay.addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (isSheetOpen) closeSheet();
        else closeModal();
      }
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        if (showingFavorites) {
          showingFavorites = false;
          document.getElementById('favToggleBtn').classList.remove('active');
          document.getElementById('filters').classList.remove('hidden');
        }
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderMasonry();
      });
    });

    document.getElementById('btnColoracao').addEventListener('click', function() {
      document.getElementById('listaCuidados').classList.remove('show');
      document.getElementById('listaColoracao').classList.toggle('show');
    });

    document.getElementById('btnCuidados').addEventListener('click', function() {
      document.getElementById('listaColoracao').classList.remove('show');
      document.getElementById('listaCuidados').classList.toggle('show');
    });

    // DRAG SHEET
    let startY = 0;
    let isDragging = false;
    const handle = document.getElementById('sheetHandle');

    handle.addEventListener('touchstart', function(e) {
      startY = e.touches[0].clientY;
      isDragging = true;
    }, { passive: true });

    handle.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      const diff = startY - e.touches[0].clientY;
      if (diff > 40 && !isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
      if (diff < -40 && isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
    }, { passive: true });

    handle.addEventListener('touchend', function() {
      isDragging = false;
    }, { passive: true });

    renderMasonry();
  
    function openFromHash() {
      const hash = location.hash || '';
      const m = hash.match(/card=([^&]+)/);
      if (!m) return;
      const key = decodeURIComponent(m[1]);
      if (styleData[key]) {
        setTimeout(() => openModal(key), 300);
      }
    }
    window.addEventListener('hashchange', openFromHash);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', openFromHash);
    } else {
      openFromHash();
    }

    function toggleZoom() {
      const zo = document.getElementById('zoomOverlay');
      if (!zo) return;
      const zoomImg = document.getElementById('zoomImage');
      const heroImg = document.getElementById('modalImg');
      const heroInfo = document.getElementById('heroInfo');
      const heroActions = document.getElementById('heroActions');
      const closeBtn = document.getElementById('modalCloseBtn');
      const toggleBtn = document.getElementById('toggleSheetBtn');
      if (zo.classList.contains('active')) {
        zo.classList.remove('active');
        if (heroInfo) heroInfo.classList.remove('hidden');
        if (heroActions) heroActions.classList.remove('hidden');
        if (closeBtn) closeBtn.classList.remove('hidden');
        if (toggleBtn) toggleBtn.classList.remove('hidden');
      } else {
        zoomImg.src = heroImg.src;
        zo.classList.add('active');
        if (heroInfo) heroInfo.classList.add('hidden');
        if (heroActions) heroActions.classList.add('hidden');
        if (closeBtn) closeBtn.classList.add('hidden');
        if (toggleBtn) toggleBtn.classList.add('hidden');
      }
    }
    (function setupZoom() {
      const heroImg = document.getElementById('modalImg');
      const zo = document.getElementById('zoomOverlay');
      if (heroImg) heroImg.addEventListener('click', toggleZoom);
      if (zo) zo.addEventListener('click', toggleZoom);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && zo && zo.classList.contains('active')) toggleZoom();
      });
    })();

  </script>
</body>
</html>
