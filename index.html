<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HairOS · Inspirações</title>
  <style>
    /* ===== IMPORTS ===== */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap');

    /* ===== RESET & VARIAVEIS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0808;
      --bg-card: #1a1612;
      --text: #f0ebe4;
      --text-sec: #d4c9bc;
      --text-muted: #8a8278;
      --gold: #c9a96e;
      --gold-light: #e8d5a8;
      --gold-glow: rgba(201, 169, 110, .12);
      --border: rgba(201, 169, 110, .08);
      --radius: 14px;
      --transition: .4s cubic-bezier(.25, .46, .45, .94);
      --t6: .6s cubic-bezier(.23, 1, .32, 1);
    }

    html, body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== LOADING SCREEN ===== */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-logo {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 700;
      font-style: italic;
      color: var(--text);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loading-logo span {
      color: var(--gold);
      text-shadow: 0 0 60px var(--gold-glow);
    }

    .loading-logo .dot {
      color: var(--gold);
      font-size: 3rem;
    }

    .loading-loader {
      margin-top: 28px;
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-bar {
      margin-top: 16px;
      width: 160px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-inner {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .loading-text {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 300;
      opacity: 0.4;
    }

    .loading-percent {
      margin-top: 4px;
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: 400;
      opacity: 0.6;
    }

    .main-content {
      opacity: 0;
      visibility: hidden;
    }

    .main-content.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toast {
      background: rgba(10, 8, 8, .95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: .8rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: all .4s cubic-bezier(.23, 1, .32, 1);
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .6);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: opacity var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }

    .brand:hover {
      opacity: .7;
    }

    .brand span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: .6rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 300;
      padding-left: 2px;
      opacity: 0.6;
    }

    .brand-sub .highlight {
      color: var(--gold);
      opacity: 1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-link {
      font-size: .7rem;
      color: var(--gold);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-link:hover {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
    }

    .header-link svg {
      width: 12px;
      height: 12px;
      fill: var(--gold);
    }

    .vitrine-badge {
      font-size: .7rem;
      color: var(--gold);
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .vitrine-badge.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .vitrine-badge:hover {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
    }

    .fav-btn-header {
      font-size: .75rem;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid rgba(201, 169, 110, .08);
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .fav-btn-header:hover {
      border-color: rgba(201, 169, 110, .3);
      background: rgba(201, 169, 110, .05);
    }

    .fav-btn-header .heart-icon {
      color: #ff4757;
      font-size: .9rem;
    }

    .fav-btn-header .fav-count {
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    .fav-btn-header.active {
      border-color: #ff4757;
      color: #ff4757;
      background: rgba(255, 71, 87, .08);
    }

    /* ===== FILTROS ===== */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transition: all var(--transition);
      scroll-snap-type: x mandatory;
    }

    .filters.hidden {
      display: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: .75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
      scroll-snap-align: start;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--gold);
      color: #0a0808;
      border-color: var(--gold);
    }

    /* ===== MASONRY HOME ===== */
    .masonry-home {
      column-count: 2;
      column-gap: 12px;
    }

    @media (min-width: 600px) {
      body { padding: 20px; }
      .masonry-home { column-count: 3; column-gap: 16px; }
    }

    @media (min-width: 900px) {
      .masonry-home { column-count: 4; column-gap: 18px; }
    }

    /* ===== CARDS HOME - MASONRY ===== */
    .card-home {
      break-inside: avoid;
      margin-bottom: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      transform: translateY(0);
    }

    .card-home:hover {
      border-color: rgba(201, 169, 110, .35);
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      z-index: 10;
    }

    .card-home-img {
      width: 100%;
      display: block;
      transition: transform .6s cubic-bezier(.25, .46, .45, .94);
      will-change: transform;
      object-fit: cover;
      object-position: center top;
    }

    .card-home:hover .card-home-img {
      transform: scale(1.06);
    }

    .h-md { height: 260px; }
    .h-lg { height: 320px; }

    .card-home-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px);
      padding: 3px 12px;
      border-radius: 12px;
      font-size: .55rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold);
      border: 1px solid var(--gold);
      font-weight: 600;
      z-index: 5;
      transition: all var(--transition);
    }

    .card-home:hover .card-home-badge {
      background: var(--gold);
      color: #0a0808;
    }

    .badge-corte { border-color: #4ecdc4; color: #4ecdc4; }
    .badge-coloracao { border-color: #ff6b6b; color: #ff6b6b; }
    .badge-penteado { border-color: #a29bfe; color: #a29bfe; }
    .badge-acessorio { border-color: #feca57; color: #feca57; }
    .badge-produto { border-color: #45b7d1; color: #45b7d1; }
    .badge-kit { border-color: #ff9ff3; color: #ff9ff3; }

    .card-home:hover .badge-corte { background: #4ecdc4; color: #0a0808; }
    .card-home:hover .badge-coloracao { background: #ff6b6b; color: #0a0808; }
    .card-home:hover .badge-penteado { background: #a29bfe; color: #0a0808; }
    .card-home:hover .badge-acessorio { background: #feca57; color: #0a0808; }
    .card-home:hover .badge-produto { background: #45b7d1; color: #0a0808; }
    .card-home:hover .badge-kit { background: #ff9ff3; color: #0a0808; }

    .card-home-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 5;
      opacity: 0;
      transform: translateY(-8px);
      transition: all var(--transition);
    }

    .card-home:hover .card-home-actions {
      opacity: 1;
      transform: translateY(0);
    }

    .card-home-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .5);
      font-size: .85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .card-home-btn:hover {
      transform: scale(1.15);
      border-color: rgba(255, 255, 255, .3);
    }

    .card-home-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .25);
      border-color: rgba(255, 71, 87, .3);
    }

    .card-home-btn.share-btn {
      color: #4ecdc4;
    }

    .card-home-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    .card-home-title {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(10, 8, 8, .8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(201, 169, 110, .2);
      padding: 5px 14px;
      border-radius: 24px;
      transition: all var(--transition);
      white-space: nowrap;
      opacity: 0;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .7rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .02em;
    }

    .card-home:hover .card-home-title {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      border-color: var(--gold);
      background: rgba(10, 8, 8, .95);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      pointer-events: none;
      transition: background .5s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay.open {
      background: rgba(0, 0, 0, .98);
      pointer-events: auto;
    }

    .modal-overlay::-webkit-scrollbar {
      width: 4px;
    }
    .modal-overlay::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-overlay::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      background: var(--bg);
      border-radius: 0;
      opacity: 0;
      transition: opacity .5s ease;
      overflow: visible;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      padding: 0 16px;
    }

    .modal-overlay.open .modal-card {
      opacity: 1;
    }

    /* ===== HERO ===== */
    .modal-hero {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      aspect-ratio: 2 / 3;
      max-height: 75vh;
      min-height: 400px;
      overflow: hidden;
      background: var(--bg-card);
      flex-shrink: 0;
      border-radius: var(--radius);
      margin-top: 16px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .modal-hero {
        max-width: 420px;
        max-height: 72vh;
        min-height: 420px;
      }
    }

    @media (min-width: 900px) {
      .modal-hero {
        max-width: 460px;
        max-height: 68vh;
        min-height: 440px;
      }
    }

    .modal-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: opacity .4s ease;
      cursor: zoom-in;
    }

    .modal-hero-img.loading {
      opacity: 0;
    }

    .modal-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 8, 8, 0) 50%,
        rgba(10, 8, 8, 0.3) 70%,
        rgba(10, 8, 8, 0.7) 90%,
        rgba(10, 8, 8, 0.9) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .modal-hero-side-left {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-hero-side-left .side-label {
      font-size: .5rem;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--text-muted);
      opacity: 0.4;
      writing-mode: vertical-rl;
      font-weight: 300;
    }

    .modal-hero-side-left .side-year {
      font-size: .5rem;
      font-weight: 300;
      color: var(--gold);
      opacity: 0.5;
      writing-mode: vertical-rl;
      letter-spacing: .1em;
    }

    .modal-hero-side-right {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: all;
    }

    .modal-hero-side-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 1rem;
    }

    .modal-hero-side-btn:hover {
      transform: scale(1.1);
      border-color: rgba(255, 255, 255, .3);
    }

    .modal-hero-side-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .2);
      border-color: rgba(255, 71, 87, .3);
    }

    .modal-hero-side-btn.share-btn {
      color: #4ecdc4;
    }

    .modal-hero-side-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    .modal-hero-side-btn svg {
      width: 16px;
      height: 16px;
    }

    .modal-hero-info {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      text-align: center;
      width: 90%;
    }

    .modal-hero-info .hero-categoria {
      display: inline-block;
      font-size: .55rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--gold);
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px);
      padding: 2px 12px;
      border-radius: 12px;
      border: 1px solid rgba(201, 169, 110, .2);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .modal-hero-info .hero-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, .5);
    }

    .modal-hero-info .hero-sub {
      font-size: .8rem;
      color: var(--text-sec);
      opacity: .8;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .4);
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 71, 87, .3);
      color: #ff4757;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t6);
      z-index: 30;
      pointer-events: all;
    }

    .modal-close-btn:hover {
      background: #ff4757;
      color: #fff;
      transform: scale(1.08);
    }

    .modal-toggle-btn {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 8px 24px;
      border-radius: 30px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
      white-space: nowrap;
      pointer-events: all;
    }

    .modal-toggle-btn:hover {
      background: var(--gold);
      color: #0a0808;
      transform: translateX(-50%) scale(1.05);
    }

    .modal-toggle-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }

    /* ===== CONTEÚDO DO MODAL - MASONRY ===== */
    .modal-content {
      padding: 0 0 40px;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .modal-section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-sec);
      margin-bottom: 16px;
      text-align: center;
      opacity: .7;
      letter-spacing: 2px;
    }

    .modal-masonry {
      column-count: 2;
      column-gap: 12px;
    }

    @media (min-width: 600px) {
      .modal-masonry { column-count: 3; column-gap: 16px; }
    }

    @media (min-width: 900px) {
      .modal-masonry { column-count: 4; column-gap: 18px; }
    }

    .modal-card-item {
      break-inside: avoid;
      margin-bottom: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(201, 169, 110, .06);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .modal-card-item:hover {
      border-color: rgba(201, 169, 110, .3);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    .modal-card-item img {
      width: 100%;
      display: block;
      transition: transform .6s cubic-bezier(.25, .46, .45, .94);
      object-fit: cover;
      object-position: center top;
    }

    .modal-card-item:hover img {
      transform: scale(1.04);
    }

    .modal-card-item .h-md { height: 220px; }
    .modal-card-item .h-lg { height: 280px; }
    .modal-card-item .h-xl { height: 340px; }

    .modal-card-item .item-label {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 8, 8, .8);
      backdrop-filter: blur(8px);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: .5rem;
      color: var(--text-sec);
      white-space: nowrap;
      opacity: 0;
      transition: all var(--transition);
      font-weight: 400;
      letter-spacing: .02em;
    }

    .modal-card-item:hover .item-label {
      opacity: 1;
    }

    /* ===== SHEET ===== */
    .modal-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 500px;
      margin: 0 auto;
      height: 55%;
      min-height: 300px;
      max-height: 85%;
      background: rgba(10, 8, 8, .98);
      backdrop-filter: blur(24px);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 30px;
      transform: translateY(100%);
      transition: transform var(--t6), height var(--t6);
      z-index: 150;
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(201, 169, 110, .15);
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .8);
    }

    .modal-sheet.show {
      transform: translateY(0);
    }
    .modal-sheet.full {
      height: 90%;
      border-radius: 0;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, .2);
      border-radius: 4px;
      margin: 0 auto 16px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background .3s;
    }

    .sheet-handle:hover {
      background: rgba(255, 255, 255, .4);
    }
    .sheet-handle:active {
      cursor: grabbing;
    }

    .sheet-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-right: -4px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
    }

    .sheet-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .sheet-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .sheet-scroll::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .sheet-header h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .sheet-header .sub {
      font-size: .8rem;
      color: var(--gold);
      font-weight: 400;
      margin-top: 2px;
    }

    .sheet-close-btn {
      background: rgba(255, 71, 87, .1);
      border: 1px solid rgba(255, 71, 87, .3);
      color: #ff4757;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t6);
      flex-shrink: 0;
    }

    .sheet-close-btn:hover {
      background: #ff4757;
      color: #fff;
    }

    .sheet-desc {
      font-size: .85rem;
      color: var(--text-sec);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .sheet-btns button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(201, 169, 110, .25);
      background: var(--gold-glow);
      color: var(--gold-light);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
    }

    .sheet-btns button.cuidados {
      background: rgba(46, 204, 113, .08);
      border-color: rgba(46, 204, 113, .2);
      color: #2ecc71;
    }

    .sheet-btns button:hover {
      opacity: .85;
      transform: scale(1.02);
    }

    .kit-lista {
      display: none;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: rgba(201, 169, 110, .04);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .kit-lista.show {
      display: block;
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .kit-lista .kit-title {
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gold);
      opacity: .7;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .kit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-sec);
      font-size: .8rem;
      transition: color .2s;
    }

    .kit-item:last-child {
      border-bottom: none;
    }
    .kit-item:hover {
      color: var(--text);
    }
    .kit-item span {
      color: var(--gold);
      opacity: .6;
    }
    .ml-badge {
      background: #FFE600;
      color: #333 !important;
      font-size: .6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 1 !important;
      flex-shrink: 0;
    }

    .sheet-cta {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #0a0808;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: .9rem;
      text-align: center;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
      text-decoration: none;
      margin-top: 8px;
    }

    .sheet-cta:hover {
      background: var(--gold-light);
      transform: scale(1.01);
    }

    /* ===== ZOOM ===== */
    .zoom-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: background .4s ease, opacity .4s ease; cursor: zoom-out;
    }
    .zoom-overlay.active { background: rgba(0,0,0,.95); opacity: 1; pointer-events: auto; }
    .zoom-overlay img {
      max-width: 92vw; max-height: 92vh; object-fit: contain;
      transform: scale(0.92); transition: transform .4s cubic-bezier(.23,1,.32,1);
      border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.8); cursor: zoom-out;
    }
    .zoom-overlay.active img { transform: scale(1); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      column-span: all;
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: .3;
    }

    .empty-state .empty-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-sec);
      margin-bottom: 8px;
    }

    .empty-state .empty-sub {
      font-size: .85rem;
      opacity: .7;
    }

    .empty-state .empty-hint {
      margin-top: 16px;
      font-size: .75rem;
      background: var(--bg-card);
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-block;
      border: 1px solid var(--border);
    }

    /* ===== UTILITÁRIOS ===== */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: var(--text-sec);
      text-align: center;
      padding: 8px 0 4px;
      opacity: .6;
      letter-spacing: 1px;
      transition: all var(--transition);
    }

    .section-title .highlight {
      color: var(--gold);
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }

    .fade-out {
      opacity: 0 !important;
      pointer-events: none !important;
    }

</head>

      toast.textContent = message;

        toast.classList.add('show');

    function gerarVariacoes(baseUrl, categoria, quantidade) {
      quantidade = quantidade || 10;
      var pool = IMAGE_POOLS[categoria] || GLOBAL_FALLBACK;
      var result = [baseUrl];
      var shuffled = pool.slice().sort(function() { return Math.random() - 0.5; });
      
      for (var i = 0; i < shuffled.length && result.length < quantidade; i++) {
        if (shuffled[i] !== baseUrl && result.indexOf(shuffled[i]) === -1) {
          result.push(shuffled[i]);
        }
      }
      
      while (result.length < quantidade) {
        var fallback = GLOBAL_FALLBACK[result.length % GLOBAL_FALLBACK.length];
        if (result.indexOf(fallback) === -1) {
          result.push(fallback);
        } else {
          result.push(GLOBAL_FALLBACK[(result.length + 1) % GLOBAL_FALLBACK.length]);
        }
      }
      
      return result;
    }

    function getFavs() {
      try { return JSON.parse(localStorage.getItem('hairos_favorites') || '[]'); } catch { return []; }
    }

    function setFavs(arr) {
      try { localStorage.setItem('hairos_favorites', JSON.stringify(arr)); } catch {}
    }

    var favorites = getFavs();
    var currentFilter = 'all';
    var showingFavorites = false;
    var isSheetOpen = false;
    var isSheetFull = false;
    var currentKey = null;

    function updateFavCounter() {
      document.getElementById('favCount').textContent = favorites.length;
    }
    updateFavCounter();

    function isFav(key) { return favorites.indexOf(key) !== -1; }

    function toggleFav(key, btn) {
      var idx = favorites.indexOf(key);
      if (idx !== -1) {
        favorites.splice(idx, 1);
      } else {
        favorites.push(key);
      }
      setFavs(favorites);
      updateFavCounter();
      if (btn) {
        btn.classList.toggle('favorited', isFav(key));
        btn.textContent = isFav(key) ? '♥' : '♡';
      }
    }

    function shareStyle(key) {
      var data = styleData[key];
      if (!data) return;
      var text = data.corte + ' - ' + data.title + '\n' + data.desc + '\n\nVeja mais em HairOS!';
      if (navigator.share) {
        navigator.share({ title: 'HairOS - ' + data.corte, text: text }).catch(function() {});
      } else {
        navigator.clipboard.writeText(text).then(function() {
          showToast('📋 Link copiado para compartilhar!');
        }).catch(function() {
          var textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showToast('📋 Link copiado para compartilhar!');
        });
      }
    }

    function getFilteredKeys() {
      if (showingFavorites) return favorites;
      var keys = Object.keys(styleData);
      if (currentFilter === 'all') return keys;
      return keys.filter(function(key) { return styleData[key].categoria === currentFilter; });
    }

    function goToHome() {
      if (document.getElementById('modalOverlay').classList.contains('open')) {
        closeModal();
      }
      
      if (showingFavorites) {
        showingFavorites = false;
        document.getElementById('favToggleBtn').classList.remove('active');
        document.getElementById('filters').classList.remove('hidden');
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        document.querySelector('[data-filter="all"]').classList.add('active');
        currentFilter = 'all';
        renderHome();
      }
    }

    // ============================================================
    // RENDER HOME
    // ============================================================
    function renderHome() {
      var container = document.getElementById('masonryHome');
      var title = document.getElementById('sectionTitle');
      var vitrineBadge = document.getElementById('vitrineBadge');
      var brandSub = document.getElementById('brandSub');
      container.innerHTML = '';

      var filteredKeys = getFilteredKeys();

      if (showingFavorites) {
        title.innerHTML = '<span>✦</span> <span class="highlight">♥ Favoritos</span> <span>✦</span>';
        vitrineBadge.classList.add('visible');
        brandSub.innerHTML = '✦ <span class="highlight">Vitrine de inspirações</span>';
      } else {
        title.innerHTML = '<span>✦</span> <span class="highlight">Inspirações</span> <span>✦</span>';
        vitrineBadge.classList.remove('visible');
        brandSub.innerHTML = '✦ <span class="highlight">Vitrine de inspirações</span>';
      }

      if (filteredKeys.length === 0) {
        var isFavView = showingFavorites;
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">' + (isFavView ? '💔' : '✨') + '</div><div class="empty-title">' + (isFavView ? 'Nenhum favorito' : 'Nenhum item encontrado') + '</div><div class="empty-sub">' + (isFavView ? 'Comece a favoritar seus estilos!' : 'Tente outra categoria') + '</div>' + (isFavView ? '<div class="empty-hint">Clique no ♥ nos cards para favoritar</div>' : '') + '</div>';
        return;
      }

      filteredKeys.forEach(function(key) {
        var data = styleData[key];
        if (!data) return;
        var fav = isFav(key);
        var altura = data.altura || 'h-md';

        var card = document.createElement('article');
        card.className = 'card-home';
        card.dataset.key = key;

        var actions = document.createElement('div');
        actions.className = 'card-home-actions';

        var shareBtn = document.createElement('button');
        shareBtn.className = 'card-home-btn share-btn';
        shareBtn.dataset.key = key;
        shareBtn.title = 'Compartilhar';
        shareBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>';
        shareBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          shareStyle(this.dataset.key);
        });
        actions.appendChild(shareBtn);

        var favBtn = document.createElement('button');
        favBtn.className = 'card-home-btn fav-btn' + (fav ? ' favorited' : '');
        favBtn.dataset.key = key;
        favBtn.title = 'Favoritar';
        favBtn.textContent = fav ? '♥' : '♡';
        favBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleFav(this.dataset.key, this);
          if (showingFavorites) renderHome();
        });
        actions.appendChild(favBtn);

        card.appendChild(actions);

        var badge = document.createElement('div');
        badge.className = 'card-home-badge badge-' + data.categoria;
        badge.textContent = data.badge;
        card.appendChild(badge);

        var img = document.createElement('img');
        img.className = 'card-home-img ' + altura;
        img.src = data.img;
        img.alt = data.corte;
        img.loading = 'lazy';
        img.addEventListener('error', function() {
          this.src = FALLBACK_IMG;
        });
        card.appendChild(img);

        var titleEl = document.createElement('div');
        titleEl.className = 'card-home-title';
        titleEl.textContent = data.corte;
        card.appendChild(titleEl);

        card.addEventListener('click', function() { openModal(key); });
        container.appendChild(card);
      });
    }

    // ============================================================
    // RENDER MODAL MASONRY
    // ============================================================
    function renderModalMasonry(key) {
      var container = document.getElementById('modalMasonry');
      container.innerHTML = '';

      var data = styleData[key];
      if (!data) return;

      var variants = data.variants || [data.img];
      while (variants.length < 10) {
        variants.push(GLOBAL_FALLBACK[variants.length % GLOBAL_FALLBACK.length]);
      }
      variants = variants.slice(0, 10);

      var alturasModal = ['h-md', 'h-lg', 'h-xl', 'h-md', 'h-lg', 'h-xl', 'h-md', 'h-lg', 'h-xl', 'h-md'];

      variants.forEach(function(imgUrl, idx) {
        var hClass = alturasModal[idx % alturasModal.length];
        var card = document.createElement('div');
        card.className = 'modal-card-item';
        card.dataset.imgUrl = imgUrl;

        var img = document.createElement('img');
        img.className = hClass;
        img.src = imgUrl;
        img.alt = data.corte;
        img.loading = 'lazy';
        img.addEventListener('error', function() {
          this.src = FALLBACK_IMG;
        });
        card.appendChild(img);

        var label = document.createElement('div');
        label.className = 'item-label';
        label.textContent = '#' + (idx + 1);
        card.appendChild(label);

        card.addEventListener('click', function(e) {
          e.stopPropagation();
          if (isSheetOpen) closeSheet();

          var imgSrc = this.dataset.imgUrl;
          
          var currentData = styleData[currentKey];
          if (currentData && currentData.variants && currentData.variants.indexOf(imgSrc) !== -1) {
            var heroImg = document.getElementById('modalImg');
            heroImg.classList.add('loading');
            heroImg.src = imgSrc;
            heroImg.onload = function() { heroImg.classList.remove('loading'); };
            document.getElementById('modalOverlay').scrollTop = 0;
          } else {
            var targetKey = null;
            for (var k in styleData) {
              var d = styleData[k];
              if (d && d.variants && d.variants.indexOf(imgSrc) !== -1) {
                targetKey = k;
                break;
              }
            }
            if (targetKey && targetKey !== key) {
              openModal(targetKey);
            }
          }
        });

        container.appendChild(card);
      });
    }

    // ============================================================
    // MODAL
    // ============================================================
    function openModal(key) {
      var data = styleData[key];
      if (!data) return;
      currentKey = key;
      if (isSheetOpen) closeSheet();

      var img = document.getElementById('modalImg');
      img.classList.add('loading');
      img.src = data.img;
      img.onload = function() { img.classList.remove('loading'); };
      img.onerror = function() {
        this.src = FALLBACK_IMG;
        this.classList.remove('loading');
      };

      document.getElementById('heroCategoria').textContent = data.badge;
      document.getElementById('heroTitle').textContent = data.corte;
      document.getElementById('heroSub').textContent = data.title;
      document.getElementById('sideCollection').textContent = data.categoria.charAt(0).toUpperCase() + data.categoria.slice(1);
      document.getElementById('sideYear').textContent = '2026';

      var isFavorited = isFav(key);
      heroFavBtn.classList.toggle('favorited', isFavorited);
      heroFavBtn.textContent = isFavorited ? '♥' : '♡';
      heroFavBtn.dataset.key = key;
      heroShareBtn.dataset.key = key;

      document.getElementById('sheetTitle').textContent = data.corte;
      document.getElementById('sheetSub').textContent = data.title;
      document.getElementById('sheetDesc').textContent = data.desc;

      var coloracaoContainer = document.getElementById('coloracaoItems');
      coloracaoContainer.innerHTML = '';
      (data.coloracao || []).forEach(function(p) {
        var a = document.createElement('a');
        a.className = 'kit-item';
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = '<span>' + p.name + '</span><span class="ml-badge">ML</span>';
        coloracaoContainer.appendChild(a);
      });

      var cuidadosContainer = document.getElementById('cuidadosItems');
      cuidadosContainer.innerHTML = '';
      (data.cuidados || []).forEach(function(p) {
        var a = document.createElement('a');
        a.className = 'kit-item';
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = '<span>' + p.name + '</span><span class="ml-badge">ML</span>';
        cuidadosContainer.appendChild(a);
      });

      document.getElementById('listaColoracao').classList.remove('show');
      document.getElementById('listaCuidados').classList.remove('show');

      renderModalMasonry(key);
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
      document.getElementById('modalOverlay').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      if (isSheetOpen) closeSheet();
      document.body.style.overflow = '';
      currentKey = null;
    }

    function openSheet() {
      document.getElementById('modalSheet').classList.add('show');
      document.getElementById('toggleSheetBtn').classList.add('hidden');
      isSheetOpen = true;
      document.getElementById('modalSheet').classList.remove('full');
      isSheetFull = false;
    }

    function closeSheet() {
      document.getElementById('modalSheet').classList.remove('show', 'full');
      document.getElementById('toggleSheetBtn').classList.remove('hidden');
      isSheetOpen = false;
      isSheetFull = false;
    }

    function toggleSheetFull() {
      if (!isSheetOpen) return;
      isSheetFull = !isSheetFull;
      document.getElementById('modalSheet').classList.toggle('full');
    }

    // ============================================================
    // ZOOM
    // ============================================================
    function toggleZoom() {
      var zo = document.getElementById('zoomOverlay');
      var zoomImg = document.getElementById('zoomImage');
      var heroImg = document.getElementById('modalImg');
      var sideLeft = document.getElementById('heroSideLeft');
      var sideRight = document.getElementById('heroSideRight');
      var closeBtn = document.getElementById('modalCloseBtn');
      var toggleBtn = document.getElementById('toggleSheetBtn');
      var heroInfo = document.getElementById('heroInfo');

      if (zo.classList.contains('active')) {
        zo.classList.remove('active');
        sideLeft.classList.remove('fade-out');
        sideRight.classList.remove('fade-out');
        closeBtn.classList.remove('fade-out');
        toggleBtn.classList.remove('fade-out');
        heroInfo.classList.remove('fade-out');
      } else {
        zoomImg.src = heroImg.src;
        zo.classList.add('active');
        sideLeft.classList.add('fade-out');
        sideRight.classList.add('fade-out');
        closeBtn.classList.add('fade-out');
        toggleBtn.classList.add('fade-out');
        heroInfo.classList.add('fade-out');
      }
    }

    // ============================================================
    // LOADING
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      var loadingScreen = document.getElementById('loadingScreen');
      var loadingBar = document.getElementById('loadingBar');
      var loadingPercent = document.getElementById('loadingPercent');
      var mainContent = document.getElementById('mainContent');

      var progress = 0;
      var interval = setInterval(function() {
        progress += Math.random() * 8 + 2;
        if (progress > 100) progress = 100;
        loadingBar.style.width = progress + '%';
        loadingPercent.textContent = Math.round(progress) + '%';
        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(function() {
            loadingScreen.classList.add('hidden');
            mainContent.classList.add('visible');
            renderHome();
          }, 400);
        }
      }, 120);

      setTimeout(function() {
        if (progress < 100) {
          progress = 100;
          loadingBar.style.width = '100%';
          loadingPercent.textContent = '100%';
        }
      }, 5000);
    });

          return;
        }
        if (isSheetOpen) {

    var isDragging = false;
    var handle = document.getElementById('sheetHandle');

    handle.addEventListener('touchstart', function(e) {
      startY = e.touches[0].clientY;
      isDragging = true;
    }, { passive: true });

    handle.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var diff = startY - e.touches[0].clientY;
      if (diff > 40 && !isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
      if (diff < -40 && isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
    }, { passive: true });

    handle.addEventListener('touchend', function() {
      isDragging = false;
    }, { passive: true });

    function openFromHash() {
      var hash = location.hash || '';
      var m = hash.match(/card=([^&]+)/);
      if (!m) return;
      var key = decodeURIComponent(m[1]);
      if (styleData[key]) {
        setTimeout(function() { openModal(key); }, 300);
      }
    }

    window.addEventListener('hashchange', openFromHash);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', openFromHash);
    } else {
      openFromHash();
    }
  </script>
</body>
</html>
