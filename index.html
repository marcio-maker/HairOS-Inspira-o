<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>HairOS · Catálogo 60</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0808;--bg-card:#1a1612;--bg-elevated:#1c1814;--text:#f0ebe4;--text-sec:#d4c9bc;--text-muted:#8a8278;--gold:#c9a96e;--gold-light:#e8d5a8;--gold-glow:rgba(201,169,110,.12);--border:rgba(201,169,110,.08);--radius:14px;--t:.35s cubic-bezier(.23,1,.32,1);--transition:0.6s cubic-bezier(0.23,1,0.32,1)}
html,body{background:var(--bg);font-family:Inter,sans-serif;color:var(--text);min-height:100%}
body{padding:12px;max-width:1200px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;font-style:italic}
.brand span{color:var(--gold)}
.brand-sub{font-size:.55rem;letter-spacing:.25em;text-transform:uppercase;color:var(--text-muted)}
.count-badge{font-size:.65rem;color:var(--gold);background:var(--gold-glow);padding:3px 10px;border-radius:100px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);padding:6px 14px;border-radius:100px;font-size:.75rem;cursor:pointer;transition:all var(--t);font-family:Inter,sans-serif;white-space:nowrap}
.filter-btn:hover{border-color:var(--gold);color:var(--text)}
.filter-btn.active{background:var(--gold);color:#0a0808;border-color:var(--gold);font-weight:600}
.masonry{column-count:2;column-gap:10px}
@media(min-width:600px){body{padding:20px}.masonry{column-count:3;column-gap:14px}}
@media(min-width:900px){.masonry{column-count:4;column-gap:16px}}
.card{break-inside:avoid;margin-bottom:10px;background:var(--bg-card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all var(--t);position:relative}
.card:hover{border-color:rgba(201,169,110,.25);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.card-img{width:100%;object-fit:cover;object-position:top center;display:block;transition:transform .5s;background:linear-gradient(135deg,#2a2218,#1a1612)}
.card:hover .card-img{transform:scale(1.03)}
.h-sm{height:140px}.h-md{height:200px}.h-lg{height:260px}.h-xl{height:320px}.h-xxl{height:380px}
.card-info{padding:10px 12px 12px}
.card-info h3{font-family:'Playfair Display',serif;font-style:italic;font-size:.9rem;font-weight:600;margin-bottom:2px;line-height:1.2}
.card-info .sub{font-size:.65rem;color:var(--text-muted)}
.card-info .badge{display:inline-block;margin-top:5px;font-size:.5rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-glow);padding:2px 7px;border-radius:100px}
.badge.produtos{color:#7ec8e3;background:rgba(126,200,227,.12)}
.badge.kits{color:#e3a87e;background:rgba(227,168,126,.12)}
.badge.coloracoes{color:#e37e9a;background:rgba(227,126,154,.12)}
.fav-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);font-size:.85rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:all var(--t)}
.fav-btn:hover{transform:scale(1.1)}.fav-btn.favorited{color:#ff4757;background:rgba(255,71,87,.2)}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-style:italic;column-span:all}

/* ===== MODAL 9:16 ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);backdrop-filter:blur(0);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;transition:background .5s ease,backdrop-filter .5s ease}
.modal-overlay.open{background:rgba(0,0,0,.85);backdrop-filter:blur(16px);pointer-events:auto}
.modal-card{position:relative;width:100%;max-width:360px;aspect-ratio:9/16;border-radius:24px;overflow:hidden;transform:scale(.9) translateY(30px);opacity:0;transition:transform .5s cubic-bezier(.23,1,.32,1),opacity .5s ease;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-overlay.open .modal-card{transform:scale(1) translateY(0);opacity:1}
.modal-card-img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;background:linear-gradient(135deg,#2a2218,#1a1612)}
.modal-close-btn{position:absolute;top:12px;right:12px;width:36px;height:36px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,71,87,.3);color:#ff4757;border-radius:50%;font-size:1.3rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);z-index:30}
.modal-close-btn:hover{background:#ff4757;color:#fff;transform:scale(1.08)}
.modal-toggle-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);backdrop-filter:blur(12px);border:1px solid var(--gold);color:var(--gold-light);padding:10px 28px;border-radius:30px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;transition:all var(--transition);z-index:20;box-shadow:0 4px 20px rgba(0,0,0,.4);opacity:1;pointer-events:auto}
.modal-toggle-btn.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
.modal-toggle-btn:hover{background:var(--gold);color:#0a0808;transform:translateX(-50%) scale(1.05)}
.modal-content-sheet{position:absolute;bottom:0;left:0;right:0;height:55%;min-height:200px;max-height:100%;background:rgba(10,8,8,.96);backdrop-filter:blur(24px);border-radius:24px 24px 0 0;padding:28px 20px 24px;transform:translateY(100%);transition:transform .6s cubic-bezier(.23,1,.32,1),height .6s cubic-bezier(.23,1,.32,1),border-radius .6s cubic-bezier(.23,1,.32,1);z-index:25;display:flex;flex-direction:column;border-top:1px solid rgba(201,169,110,.15);overflow:hidden;touch-action:none}
.modal-content-sheet.show{transform:translateY(0)}
.modal-content-sheet.full{height:100%;border-radius:0}
.sheet-handle-wrapper{flex-shrink:0;padding-bottom:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet-handle-wrapper:active{cursor:grabbing}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin:0 auto;transition:background .3s}
.sheet-handle-wrapper:hover .sheet-handle{background:rgba(255,255,255,.4)}
.sheet-scroll-area{flex:1;overflow-y:auto;padding-right:4px;margin-right:-4px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;scroll-behavior:smooth}
.sheet-scroll-area::-webkit-scrollbar{width:3px}
.sheet-scroll-area::-webkit-scrollbar-track{background:transparent}
.sheet-scroll-area::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px}
.sheet-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.sheet-header h2{font-family:'Playfair Display',serif;font-style:italic;font-size:1.4rem;font-weight:700;color:var(--text)}
.sheet-header .sub{font-size:.85rem;color:var(--gold);font-weight:400;margin-top:2px}
.sheet-close-btn{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);color:#ff4757;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);flex-shrink:0}
.sheet-close-btn:hover{background:#ff4757;color:#fff}
.sheet-desc{font-size:.82rem;color:var(--text-sec);font-weight:300;line-height:1.55;margin-bottom:14px;border-top:1px solid var(--border);padding-top:12px}
.sheet-btns{display:flex;gap:8px;margin-bottom:12px}
.sheet-btns button{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(201,169,110,.25);background:var(--gold-glow);color:var(--gold-light);font-size:.75rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;transition:all var(--transition)}
.sheet-btns button.cuidados{background:rgba(46,204,113,.08);border-color:rgba(46,204,113,.2);color:#2ecc71}
.sheet-btns button:hover{opacity:.85;transform:scale(1.02)}
.kit-lista{display:none;margin-bottom:12px;padding:8px 12px;background:rgba(201,169,110,.04);border-radius:10px;border:1px solid var(--border)}
.kit-lista.show{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.kit-lista .kit-title{font-size:.55rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);opacity:.7;margin-bottom:4px;font-weight:600}
.kit-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text-sec);font-size:.75rem;transition:color .2s}
.kit-item:last-child{border-bottom:none}
.kit-item:hover{color:var(--text)}
.kit-item span{color:var(--gold);opacity:.6}
.sheet-cta{display:block;width:100%;padding:10px;background:var(--gold);color:#0a0808;border:none;border-radius:10px;font-weight:700;font-size:.85rem;text-align:center;cursor:pointer;font-family:Inter,sans-serif;transition:all var(--transition);text-decoration:none;margin-top:12px}
.sheet-cta:hover{background:var(--gold-light);transform:scale(1.01)}
</style>
</head>

<header class="header">
<div><div class="brand">Hair<span>OS</span></div><div class="brand-sub">Catalogo</div></div>

      </div>
    </div>
  </div>
</div>

const heights=['h-sm','h-lg','h-md','h-xl','h-md','h-xxl','h-lg','h-sm','h-xl','h-md','h-lg','h-xxl','h-sm','h-xl','h-md'];
function safeGet(){try{return JSON.parse(localStorage.getItem('hairos_favorites')||'[]')}catch(e){return[]}}
function safeSet(a){try{localStorage.setItem('hairos_favorites',JSON.stringify(a))}catch(e){}}
let favorites=safeGet();
function isFav(id){return favorites.includes(id)}
function toggleFav(id,btn){if(isFav(id))favorites=favorites.filter(k=>k!==id);else favorites.push(id);safeSet(favorites);if(btn){btn.classList.toggle('favorited',isFav(id));btn.textContent=isFav(id)?'\u2665':'\u2661'}}

function render(cat){
  const c=document.getElementById('masonry');c.innerHTML='';
  const items=cat==='all'?catalog:catalog.filter(i=>i.cat===cat);
  document.getElementById('countBadge').textContent=items.length+' itens';
  if(!items.length){c.innerHTML='<div class="empty">Nenhum item nesta categoria</div>';return}
  items.forEach((item,idx)=>{
    const fav=isFav(item.id);const h=heights[idx%heights.length];
    const card=document.createElement('article');card.className='card';
    card.innerHTML='<button class="fav-btn '+(fav?'favorited':'')+'" data-id="'+item.id+'">'+(fav?'\u2665':'\u2661')+'</button><img class="card-img '+h+'" src="'+item.img+'" alt="'+item.name+'" loading="lazy"><div class="card-info"><h3>'+item.name+'</h3><div class="sub">'+item.sub+'</div><span class="badge '+item.cat+'">'+item.badge+'</span></div>';
    card.querySelector('.fav-btn').addEventListener('click',function(e){e.stopPropagation();toggleFav(this.dataset.id,this)});
    card.addEventListener('click',function(){openModal(item)});c.appendChild(card);
  });
}

/* ===== MODAL 9:16 LOGIC ===== */
const overlay=document.getElementById('modalOverlay');
const contentSheet=document.getElementById('contentSheet');
const handleWrapper=document.getElementById('handleWrapper');
const toggleContentBtn=document.getElementById('toggleContentBtn');
const closeContentBtn=document.getElementById('closeContentBtn');
const modalCloseBtn=document.getElementById('modalCloseBtn');
let isContentOpen=false,isFull=false;

const defaultColoracao=['Tinta INOA 8 (Base)','Tinta INOA 10.1 (Nuance)','Tonalizante','Agua Oxigenada 20Vol','Revelador'];
const defaultCuidados=['Shampoo Vitamino Color','Condicionador Joico Moisture','Mascara Absolut Repair','Leave-in Molecular','Oleo Capilar LOreal'];

function openModal(item){
  document.getElementById('modalImg').src=item.img;
  document.getElementById('modalTitle').textContent=item.name;
  document.getElementById('modalSub').textContent=item.sub;
  document.getElementById('modalDesc').textContent=item.desc;
  // Populate kit lists
  document.getElementById('coloracaoItems').innerHTML=defaultColoracao.map(n=>'<a href="#" class="kit-item"><span>'+n+'</span><span>\u2192</span></a>').join('');
  document.getElementById('cuidadosItems').innerHTML=defaultCuidados.map(n=>'<a href="#" class="kit-item"><span>'+n+'</span><span>\u2192</span></a>').join('');
  document.getElementById('listaColoracao').classList.remove('show');
  document.getElementById('listaCuidados').classList.remove('show');
  closeContent();
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  overlay.classList.remove('open');
  closeContent();
  document.body.style.overflow='';
}
function openContent(){
  contentSheet.classList.add('show');
  toggleContentBtn.classList.add('hidden');
  isContentOpen=true;
  contentSheet.classList.remove('full');
  isFull=false;
}
function closeContent(){
  contentSheet.classList.remove('show');
  contentSheet.classList.remove('full');
  toggleContentBtn.classList.remove('hidden');
  isContentOpen=false;isFull=false;
}
function toggleFull(){
  if(!isContentOpen)return;
  isFull=!isFull;
  contentSheet.classList.toggle('full');
}

modalCloseBtn.addEventListener('click',closeModal);
toggleContentBtn.addEventListener('click',openContent);
closeContentBtn.addEventListener('click',closeContent);
handleWrapper.addEventListener('click',toggleFull);
overlay.addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(isContentOpen)closeContent();else closeModal()}
});
document.getElementById('btnColoracao').addEventListener('click',function(){
  document.getElementById('listaCuidados').classList.remove('show');
  document.getElementById('listaColoracao').classList.toggle('show');
});
document.getElementById('btnCuidados').addEventListener('click',function(){
  document.getElementById('listaColoracao').classList.remove('show');
  document.getElementById('listaCuidados').classList.toggle('show');
});

/* Drag touch */
let startY=0,isDragging=false;
handleWrapper.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;isDragging=true},{passive:true});
handleWrapper.addEventListener('touchmove',function(e){
  if(!isDragging)return;
  const diff=startY-e.touches[0].clientY;
  if(diff>30&&!isFull&&isContentOpen){toggleFull();isDragging=false}
  if(diff<-30&&isFull&&isContentOpen){toggleFull();isDragging=false}
},{passive:true});
handleWrapper.addEventListener('touchend',function(){isDragging=false},{passive:true});

document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
    this.classList.add('active');render(this.dataset.cat);
  });
});
render('all');
</script>
