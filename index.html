  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0808;
      --bg-card: #1a1612;
      --bg-elevated: #221d18;
      --text: #f0ebe4;
      --text-sec: #d4c9bc;
      --text-muted: #8a8278;
      --gold: #c9a96e;
      --gold-light: #e8d5a8;
      --gold-glow: rgba(201, 169, 110, .12);
      --border: rgba(201, 169, 110, .08);
      --border-gold: rgba(201, 169, 110, .25);
      --radius: 14px;
      --transition: .4s cubic-bezier(.22, .61, .36, 1);
      --ease-luxury: cubic-bezier(.23, 1, .32, 1);
      --t6: .6s var(--ease-luxury);
      --shadow: 0 8px 32px rgba(0, 0, 0, .6);
      --focus-ring: 0 0 0 3px rgba(201, 169, 110, 0.5);
    }

    [data-theme="light"] {
      --bg: #f5f0eb;
      --bg-card: #ffffff;
      --bg-elevated: #f0ece7;
      --text: #1a1612;
      --text-sec: #3d352e;
      --text-muted: #8a8278;
      --gold: #b8955a;
      --gold-light: #d4b87a;
      --gold-glow: rgba(184, 149, 90, .12);
      --border: rgba(184, 149, 90, .15);
      --border-gold: rgba(184, 149, 90, .35);
      --shadow: 0 8px 32px rgba(0, 0, 0, .12);
      --focus-ring: 0 0 0 3px rgba(184, 149, 90, 0.5);
    }

    html,
    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }

    body {
      padding: 0 12px 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    * {
      scrollbar-width: none;
      scrollbar-color: transparent transparent;
    }

    *::-webkit-scrollbar {
      width: 0px;
      height: 0px;
      background: transparent;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: transparent;
      border: none;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: transparent;
    }

    .icon-svg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-svg svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-svg.filled svg {
      fill: currentColor;
      stroke: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    .card-home,
    .fav-item,
    .transf-card,
    .perfil-card,
    .sobre-card,
    .contato-card {
      animation: fadeInUp 0.6s cubic-bezier(.23, 1, .32, 1) both;
    }

    .modal-card-item {
      animation: fadeInScale 0.5s cubic-bezier(.23, 1, .32, 1) both;
    }

    @keyframes logoZoomIn {
      0% {
        opacity: 0;
        transform: scale(0.1);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes logoZoomOut {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(8);
        opacity: 0;
      }
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.8s cubic-bezier(0.4, 0, 0.2, 1), background var(--transition);
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-logo {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 700;
      font-style: italic;
      color: var(--text);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: logoZoomIn 4.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      will-change: transform, opacity;
    }

    .loading-logo.zoom-out {
      animation: logoZoomOut 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    .loading-logo span {
      color: var(--gold);
      text-shadow: 0 0 60px var(--gold-glow);
    }

    .loading-logo .dot {
      color: var(--gold);
      font-size: 3rem;
    }

    .loading-bar {
      margin-top: 28px;
      width: min(210px, 64vw);
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }

    .loading-bar-inner {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .loading-text {
      margin-top: 16px;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 300;
      opacity: 0.4;
      transition: opacity 0.6s ease;
    }

    .loading-percent {
      margin-top: 6px;
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: 400;
      opacity: 0.6;
      transition: opacity 0.6s ease;
    }

    .main-content {
      opacity: 0;
      visibility: hidden;
      transform: translateY(15px);
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-content.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .toast-container {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toast {
      background: rgba(10, 8, 8, .95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: .8rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: all .4s cubic-bezier(.23, 1, .32, 1);
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .6);
      white-space: nowrap;
    }

    [data-theme="light"] .toast {
      background: rgba(255, 255, 255, .95);
      color: var(--text);
      border-color: var(--gold);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .toast.toast-action {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 8px 18px;
    }

    .toast-action-text {
      line-height: 1.2;
    }

    .toast-action-btn {
      border: 1px solid var(--gold);
      border-radius: 100px;
      background: var(--gold);
      color: #1b1209;
      padding: 6px 11px;
      font: 600 .68rem Inter, sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: filter .25s ease, transform .25s ease;
    }

    .toast-action-btn:hover,
    .toast-action-btn:focus-visible {
      filter: brightness(1.1);
      transform: translateY(-1px);
      outline: var(--focus-ring);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      margin: 10px 0 20px;
      position: sticky;
      top: 10px;
      z-index: 500;
      background: rgba(18, 14, 12, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(201, 169, 110, 0.14);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 0.5px rgba(201, 169, 110, 0.08);
      transition: transform 0.38s cubic-bezier(.23, 1, .32, 1), opacity 0.38s ease, background var(--transition), border var(--transition);
    }

    .header.modal-open {
      opacity: 0 !important;
      transform: translateY(-100%) !important;
      pointer-events: none !important;
    }

    [data-theme="light"] .header {
      background: rgba(255, 252, 248, 0.85);
      border-color: rgba(184, 149, 90, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    .header.hide {
      transform: translateY(calc(-100% - 20px));
      opacity: 0;
      pointer-events: none;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: opacity var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }

    .brand:hover {
      opacity: .7;
    }

    .brand span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: .6rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 300;
      padding-left: 2px;
      opacity: 0.6;
    }

    .brand-sub .highlight {
      color: var(--gold);
      opacity: 1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-link {
      font-size: .7rem;
      color: var(--gold);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-link:hover,
    .header-link:focus-visible {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
      outline: var(--focus-ring);
    }

    .header-link svg {
      width: 12px;
      height: 12px;
      fill: var(--gold);
    }

    .hamburger-btn {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: all var(--transition);
      padding: 6px;
      flex-shrink: 0;
    }

    .hamburger-btn:hover,
    .hamburger-btn:focus-visible {
      border-color: var(--gold);
      background: var(--gold-glow);
      outline: var(--focus-ring);
    }

    .hamburger-btn .bar {
      width: 16px;
      height: 1.5px;
      background: var(--text-sec);
      border-radius: 2px;
      transition: all var(--transition);
    }

    .hamburger-btn .bar:nth-child(2) {
      width: 11px;
      align-self: flex-end;
    }

    .hamburger-btn .bar:nth-child(3) {
      width: 7px;
      align-self: flex-end;
    }

    .hamburger-btn:hover .bar {
      background: var(--gold);
    }

    .vitrine-badge {
      font-size: .7rem;
      color: var(--gold);
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .vitrine-badge.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .vitrine-badge:hover,
    .vitrine-badge:focus-visible {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
      outline: var(--focus-ring);
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: none;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 16px;
    }

    .menu-overlay.active {
      display: flex;
      animation: fadeInMenu 0.25s ease;
    }

    @keyframes fadeInMenu {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .menu-panel {
      background: rgba(10, 8, 8, .95);
      backdrop-filter: blur(24px);
      border-radius: 16px;
      padding: 20px 16px;
      width: 100%;
      max-width: 260px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      animation: slideMenu 0.25s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    [data-theme="light"] .menu-panel {
      background: rgba(255, 252, 248, .98);
      border-color: var(--border-gold);
    }

    @keyframes slideMenu {
      from {
        transform: translateX(30px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .menu-panel::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    .menu-panel::-webkit-scrollbar-thumb {
      background: transparent;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .menu-header span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .8rem;
      color: var(--text);
      letter-spacing: 2px;
    }

    .menu-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all var(--transition);
    }

    .menu-close:hover,
    .menu-close:focus-visible {
      color: var(--text);
      transform: rotate(90deg);
      outline: var(--focus-ring);
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--text-sec);
      font-size: .85rem;
      font-weight: 400;
      border: none;
      background: transparent;
      width: 100%;
      font-family: 'Inter', sans-serif;
      text-align: left;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      background: var(--gold-glow);
      color: var(--text);
      transform: translateX(4px);
      outline: var(--focus-ring);
    }

    .menu-item .icon {
      font-size: 1rem;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .menu-item .item-count {
      margin-left: auto;
      background: var(--gold);
      color: #0a0808;
      font-size: .6rem;
      font-weight: 600;
      padding: 0 8px;
      border-radius: 20px;
      min-width: 20px;
      text-align: center;
    }

    .menu-item .item-count.empty {
      background: var(--border);
      color: var(--text-muted);
    }

    .menu-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }

    .menu-theme {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px;
      color: var(--text-sec);
      font-size: .8rem;
      font-weight: 300;
    }

    .menu-theme .theme-switch {
      background: var(--border);
      border: none;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: .65rem;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      min-height: 24px;
    }

    .menu-theme .theme-switch:hover,
    .menu-theme .theme-switch:focus-visible {
      background: var(--gold-glow);
      color: var(--gold);
      outline: var(--focus-ring);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transition: all var(--transition);
      scroll-snap-type: x mandatory;
    }

    .filters.hidden {
      display: none !important;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: .75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
      scroll-snap-align: start;
    }

    .filter-btn:hover,
    .filter-btn:focus-visible {
      border-color: var(--gold);
      color: var(--text);
      outline: var(--focus-ring);
    }

    .filter-btn.active {
      background: var(--gold);
      color: #0a0808;
      border-color: var(--gold);
    }

    [data-theme="light"] .filter-btn.active {
      color: #fff;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: .18em;
      padding: 20px 0 14px;
      opacity: .6;
      user-select: none;
    }

    .section-title .highlight {
      color: var(--gold);
      opacity: 1;
      font-size: 1.1rem;
      letter-spacing: .04em;
    }

    .masonry-home {
      column-count: 2;
      column-gap: 12px;
    }

    @media (min-width: 600px) {
      body {
        padding: 0 20px 20px;
      }

      .masonry-home {
        column-count: 3;
        column-gap: 16px;
      }
    }

    @media (min-width: 900px) {
      .masonry-home {
        column-count: 4;
        column-gap: 18px;
      }
    }

    .card-home {
      break-inside: avoid;
      margin-bottom: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      transform: translateY(0);
    }

    .card-home:hover,
    .card-home:focus-within {
      border-color: rgba(201, 169, 110, .35);
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      z-index: 10;
    }

    .card-home-img {
      width: 100%;
      display: block;
      transition: opacity 0.5s ease, transform .6s cubic-bezier(.25, .46, .45, .94);
      will-change: transform, opacity;
      object-fit: cover;
      object-position: center top;
    }

    .card-home:hover .card-home-img,
    .card-home:focus-within .card-home-img {
      transform: scale(1.06);
    }

    .h-md {
      height: 260px;

    /* ============================================================
       GLOW SYSTEM · HairOS — versão final corrigida
       - Aba Coloração inativa: pulso dourado
       - Aba Cuidados inativa: pulso verde (mantém identidade)
       - Aba ativa: cor própria, sem pulso
       - Respeita prefers-reduced-motion
       - Light theme usa box-shadow (não text-shadow)
       ============================================================ */

    @keyframes glowPulseGold {

      0%,
      100% {
        text-shadow: 0 0 3px rgba(201, 169, 110, .25),
          0 0 7px rgba(201, 169, 110, .10);
        opacity: .78;
      }

      50% {
        text-shadow: 0 0 9px rgba(201, 169, 110, .6),
          0 0 16px rgba(201, 169, 110, .25);
        opacity: 1;
      }
    }

    @keyframes glowPulseGreen {

      0%,
      100% {
        text-shadow: 0 0 3px rgba(46, 204, 113, .25),
          0 0 7px rgba(46, 204, 113, .10);
        opacity: .78;
      }

      50% {
        text-shadow: 0 0 9px rgba(46, 204, 113, .55),
          0 0 16px rgba(46, 204, 113, .22);
        opacity: 1;
      }
    }

    @keyframes glowPulseSoft {

      0%,
      100% {
        box-shadow: 0 0 0 rgba(201, 169, 110, 0);
      }

      50% {
        box-shadow: 0 0 14px rgba(201, 169, 110, .28),
          0 0 28px rgba(201, 169, 110, .12);
      }
    }

    /* -------- Abas do sheet -------- */

    /* Coloração inativa: pulso dourado */
    .sheet-btns button:not(.active):not(.cuidados) {
      color: #d4af37;
      opacity: .8;
      animation: glowPulseGold 2.8s ease-in-out infinite;
      transition: color .3s ease, text-shadow .3s ease, opacity .3s ease;
    }

    .sheet-btns button:not(.active):not(.cuidados):hover,
    .sheet-btns button:not(.active):not(.cuidados):focus-visible {
      color: #f0d98a;
      opacity: 1;
      animation-play-state: paused;
      text-shadow: 0 0 10px rgba(212, 175, 55, .75),
        0 0 18px rgba(212, 175, 55, .3);
    }

    /* Cuidados inativa: pulso verde */
    .sheet-btns button.cuidados:not(.active) {
      color: #2ecc71;
      opacity: .8;
      animation: glowPulseGreen 2.8s ease-in-out infinite;
      transition: color .3s ease, text-shadow .3s ease, opacity .3s ease;
    }

    .sheet-btns button.cuidados:not(.active):hover,
    .sheet-btns button.cuidados:not(.active):focus-visible {
      color: #58e08d;
      opacity: 1;
      animation-play-state: paused;
      text-shadow: 0 0 10px rgba(46, 204, 113, .75),
        0 0 18px rgba(46, 204, 113, .3);
    }

    /* Aba ativa: sem pulso */
    .sheet-btns button.active {
      animation: none;
      opacity: 1;
      text-shadow: none;
    }

    /* -------- Badge "Ver Vitrine" -------- */
    .vitrine-badge.visible {
      animation: glowPulseGold 2.8s ease-in-out infinite;
    }

    .vitrine-badge.visible:hover,
    .vitrine-badge.visible:focus-visible {
      animation-play-state: paused;
      box-shadow: 0 0 14px rgba(201, 169, 110, .35),
        inset 0 0 6px rgba(201, 169, 110, .12);
    }

    /* -------- Contador no menu -------- */
    .menu-item .item-count:not(.empty) {
      box-shadow: 0 0 8px rgba(201, 169, 110, .45),
        0 0 16px rgba(201, 169, 110, .18);
      transition: box-shadow .3s ease;
    }

    .menu-item:hover .item-count:not(.empty) {
      box-shadow: 0 0 12px rgba(201, 169, 110, .65),
        0 0 22px rgba(201, 169, 110, .28);
    }

    /* -------- Botões com hover glow -------- */
    .modal-toggle-btn:hover,
    .modal-toggle-btn:focus-visible {
      box-shadow: 0 0 22px rgba(201, 169, 110, .45),
        0 0 40px rgba(201, 169, 110, .18),
        0 4px 20px rgba(0, 0, 0, .4);
    }

    .btn-gold:hover,
    .btn-gold:focus-visible {
      box-shadow: 0 0 16px rgba(201, 169, 110, .5),
        0 0 32px rgba(201, 169, 110, .2);
    }

    .pix-copy-btn:hover,
    .pix-copy-btn:focus-visible {
      box-shadow: 0 0 18px rgba(201, 169, 110, .45);
    }

    /* -------- Light theme: usa box-shadow -------- */
    [data-theme="light"] .sheet-btns button:not(.active):not(.cuidados) {
      color: #b8955a;
      animation: glowPulseSoft 2.8s ease-in-out infinite;
      text-shadow: none;
      opacity: .85;
    }

    [data-theme="light"] .sheet-btns button:not(.active):not(.cuidados):hover,
    [data-theme="light"] .sheet-btns button:not(.active):not(.cuidados):focus-visible {
      color: #8a6d3b;
      box-shadow: 0 0 12px rgba(184, 149, 90, .35);
      text-shadow: none;
    }

    [data-theme="light"] .sheet-btns button.cuidados:not(.active) {
      color: #1a9e56;
      animation: glowPulseSoft 2.8s ease-in-out infinite;
      text-shadow: none;
      opacity: .85;
    }

    [data-theme="light"] .sheet-btns button.cuidados:not(.active):hover,
    [data-theme="light"] .sheet-btns button.cuidados:not(.active):focus-visible {
      color: #158a48;
      box-shadow: 0 0 12px rgba(46, 204, 113, .3);
      text-shadow: none;
    }

    [data-theme="light"] .vitrine-badge.visible {
      animation: glowPulseSoft 2.8s ease-in-out infinite;
    }

    /* -------- Acessibilidade -------- */
    @media (prefers-reduced-motion: reduce) {

      .sheet-btns button:not(.active),
      .sheet-btns button:not(.active):not(.cuidados),
      .sheet-btns button.cuidados:not(.active),
      .vitrine-badge.visible,
      [data-theme="light"] .sheet-btns button:not(.active),
      [data-theme="light"] .sheet-btns button:not(.active):not(.cuidados),
      [data-theme="light"] .sheet-btns button.cuidados:not(.active),
      [data-theme="light"] .vitrine-badge.visible {
        animation: none !important;
        opacity: .9;
      }
    }
  </style>
