<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HairOS · Inspirações</title>
  <style>
    /* ===== IMPORTS ===== */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap');

    /* ===== RESET & VARIAVEIS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0808;
      --bg-card: #1a1612;
      --text: #f0ebe4;
      --text-sec: #d4c9bc;
      --text-muted: #8a8278;
      --gold: #c9a96e;
      --gold-light: #e8d5a8;
      --gold-glow: rgba(201, 169, 110, .12);
      --border: rgba(201, 169, 110, .08);
      --radius: 14px;
      --transition: .4s cubic-bezier(.25, .46, .45, .94);
      --t6: .6s cubic-bezier(.23, 1, .32, 1);
    }

    html, body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== LOADING SCREEN ===== */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-logo {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 700;
      font-style: italic;
      color: var(--text);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loading-logo span {
      color: var(--gold);
      text-shadow: 0 0 60px var(--gold-glow);
    }

    .loading-logo .dot {
      color: var(--gold);
      font-size: 3rem;
    }

    .loading-loader {
      margin-top: 28px;
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-bar {
      margin-top: 16px;
      width: 160px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-inner {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .loading-text {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 300;
      opacity: 0.4;
    }

    .loading-percent {
      margin-top: 4px;
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: 400;
      opacity: 0.6;
    }

    .main-content {
      opacity: 0;
      visibility: hidden;
    }

    .main-content.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: opacity var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }

    .brand:hover {
      opacity: .7;
    }

    .brand span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: .6rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 300;
      padding-left: 2px;
      opacity: 0.6;
    }

    .brand-sub .highlight {
      color: var(--gold);
      opacity: 1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-link {
      font-size: .7rem;
      color: var(--gold);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-link:hover {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
    }

    .header-link svg {
      width: 12px;
      height: 12px;
      fill: var(--gold);
    }

    .vitrine-badge {
      font-size: .7rem;
      color: var(--gold);
      padding: 6px 12px;
      border: 1px solid rgba(201, 169, 110, .25);
      border-radius: 100px;
      white-space: nowrap;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .vitrine-badge.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .vitrine-badge:hover {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
    }

    .fav-btn-header {
      font-size: .75rem;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid rgba(201, 169, 110, .08);
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .fav-btn-header:hover {
      border-color: rgba(201, 169, 110, .3);
      background: rgba(201, 169, 110, .05);
    }

    .fav-btn-header .heart-icon {
      color: #ff4757;
      font-size: .9rem;
    }

    .fav-btn-header .fav-count {
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    .fav-btn-header.active {
      border-color: #ff4757;
      color: #ff4757;
      background: rgba(255, 71, 87, .08);
    }

    /* ===== FILTROS ===== */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transition: all var(--transition);
      scroll-snap-type: x mandatory;
    }

    .filters.hidden {
      display: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: .75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
      scroll-snap-align: start;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--gold);
      color: #0a0808;
      border-color: var(--gold);
    }

    /* ===== MASONRY HOME ===== */
    .masonry-home {
      column-count: 2;
      column-gap: 12px;
    }

    @media (min-width: 600px) {
      body { padding: 20px; }
      .masonry-home { column-count: 3; column-gap: 16px; }
    }

    @media (min-width: 900px) {
      .masonry-home { column-count: 4; column-gap: 18px; }
    }

    /* ===== CARDS HOME - MASONRY ===== */
    .card-home {
      break-inside: avoid;
      margin-bottom: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      transform: translateY(0);
    }

    .card-home:hover {
      border-color: rgba(201, 169, 110, .35);
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
      z-index: 10;
    }

    .card-home-img {
      width: 100%;
      display: block;
      transition: transform .6s cubic-bezier(.25, .46, .45, .94);
      will-change: transform;
    }

    .card-home:hover .card-home-img {
      transform: scale(1.06);
    }

    /* ===== 2 TAMANHOS DOS CARDS HOME ===== */
    .h-md { height: 340px; }
    .h-lg { height: 400px; }

    .card-home-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px);
      padding: 3px 12px;
      border-radius: 12px;
      font-size: .55rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold);
      border: 1px solid var(--gold);
      font-weight: 600;
      z-index: 5;
      transition: all var(--transition);
    }

    .card-home:hover .card-home-badge {
      background: var(--gold);
      color: #0a0808;
    }

    .badge-corte { border-color: #4ecdc4; color: #4ecdc4; }
    .badge-coloracao { border-color: #ff6b6b; color: #ff6b6b; }
    .badge-penteado { border-color: #a29bfe; color: #a29bfe; }
    .badge-acessorio { border-color: #feca57; color: #feca57; }
    .badge-produto { border-color: #45b7d1; color: #45b7d1; }
    .badge-kit { border-color: #ff9ff3; color: #ff9ff3; }

    .card-home:hover .badge-corte { background: #4ecdc4; color: #0a0808; }
    .card-home:hover .badge-coloracao { background: #ff6b6b; color: #0a0808; }
    .card-home:hover .badge-penteado { background: #a29bfe; color: #0a0808; }
    .card-home:hover .badge-acessorio { background: #feca57; color: #0a0808; }
    .card-home:hover .badge-produto { background: #45b7d1; color: #0a0808; }
    .card-home:hover .badge-kit { background: #ff9ff3; color: #0a0808; }

    .card-home-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 5;
      opacity: 0;
      transform: translateY(-8px);
      transition: all var(--transition);
    }

    .card-home:hover .card-home-actions {
      opacity: 1;
      transform: translateY(0);
    }

    .card-home-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .5);
      font-size: .85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .card-home-btn:hover {
      transform: scale(1.15);
      border-color: rgba(255, 255, 255, .3);
    }

    .card-home-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .25);
      border-color: rgba(255, 71, 87, .3);
    }

    .card-home-btn.share-btn {
      color: #4ecdc4;
    }

    .card-home-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    .card-home-title {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(10, 8, 8, .8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(201, 169, 110, .2);
      padding: 5px 14px;
      border-radius: 24px;
      transition: all var(--transition);
      white-space: nowrap;
      opacity: 0;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .7rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .02em;
    }

    .card-home:hover .card-home-title {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      border-color: var(--gold);
      background: rgba(10, 8, 8, .95);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      pointer-events: none;
      transition: background .5s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay.open {
      background: rgba(0, 0, 0, .98);
      pointer-events: auto;
    }

    .modal-overlay::-webkit-scrollbar {
      width: 4px;
    }
    .modal-overlay::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-overlay::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      background: var(--bg);
      border-radius: 0;
      opacity: 0;
      transition: opacity .5s ease;
      overflow: visible;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      padding: 0 16px;
    }

    .modal-overlay.open .modal-card {
      opacity: 1;
    }

    /* ===== HERO ===== */
    .modal-hero {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      aspect-ratio: 2 / 3;
      max-height: 75vh;
      min-height: 400px;
      overflow: hidden;
      background: var(--bg-card);
      flex-shrink: 0;
      border-radius: var(--radius);
      margin-top: 16px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .modal-hero {
        max-width: 420px;
        max-height: 72vh;
        min-height: 420px;
      }
    }

    @media (min-width: 900px) {
      .modal-hero {
        max-width: 460px;
        max-height: 68vh;
        min-height: 440px;
      }
    }

    .modal-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: opacity .4s ease;
      cursor: zoom-in;
    }

    .modal-hero-img.loading {
      opacity: 0;
    }

    .modal-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 8, 8, 0) 50%,
        rgba(10, 8, 8, 0.3) 70%,
        rgba(10, 8, 8, 0.7) 90%,
        rgba(10, 8, 8, 0.9) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .modal-hero-side-left {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-hero-side-left .side-label {
      font-size: .5rem;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--text-muted);
      opacity: 0.4;
      writing-mode: vertical-rl;
      font-weight: 300;
    }

    .modal-hero-side-left .side-year {
      font-size: .5rem;
      font-weight: 300;
      color: var(--gold);
      opacity: 0.5;
      writing-mode: vertical-rl;
      letter-spacing: .1em;
    }

    .modal-hero-side-right {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: all;
    }

    .modal-hero-side-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 1rem;
    }

    .modal-hero-side-btn:hover {
      transform: scale(1.1);
      border-color: rgba(255, 255, 255, .3);
    }

    .modal-hero-side-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .2);
      border-color: rgba(255, 71, 87, .3);
    }

    .modal-hero-side-btn.share-btn {
      color: #4ecdc4;
    }

    .modal-hero-side-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    .modal-hero-side-btn svg {
      width: 16px;
      height: 16px;
    }

    .modal-hero-info {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      text-align: center;
      width: 90%;
    }

    .modal-hero-info .hero-categoria {
      display: inline-block;
      font-size: .55rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--gold);
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px);
      padding: 2px 12px;
      border-radius: 12px;
      border: 1px solid rgba(201, 169, 110, .2);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .modal-hero-info .hero-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, .5);
    }

    .modal-hero-info .hero-sub {
      font-size: .8rem;
      color: var(--text-sec);
      opacity: .8;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .4);
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 71, 87, .3);
      color: #ff4757;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t6);
      z-index: 30;
      pointer-events: all;
    }

    .modal-close-btn:hover {
      background: #ff4757;
      color: #fff;
      transform: scale(1.08);
    }

    .modal-toggle-btn {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 8px 24px;
      border-radius: 30px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
      white-space: nowrap;
      pointer-events: all;
    }

    .modal-toggle-btn:hover {
      background: var(--gold);
      color: #0a0808;
      transform: translateX(-50%) scale(1.05);
    }

    .modal-toggle-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }

    /* ===== CONTEÚDO DO MODAL - MASONRY ===== */
    .modal-content {
      padding: 0 0 40px;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .modal-section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-sec);
      margin-bottom: 16px;
      text-align: center;
      opacity: .7;
      letter-spacing: 2px;
    }

    .modal-masonry {
      column-count: 2;
      column-gap: 12px;
    }

    @media (min-width: 600px) {
      .modal-masonry { column-count: 3; column-gap: 16px; }
    }

    @media (min-width: 900px) {
      .modal-masonry { column-count: 4; column-gap: 18px; }
    }

    .modal-card-item {
      break-inside: avoid;
      margin-bottom: 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(201, 169, 110, .06);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .modal-card-item:hover {
      border-color: rgba(201, 169, 110, .3);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    .modal-card-item img {
      width: 100%;
      display: block;
      transition: transform .6s cubic-bezier(.25, .46, .45, .94);
    }

    .modal-card-item:hover img {
      transform: scale(1.04);
    }

    /* ===== 3 TAMANHOS DOS CARDS MODAL - MASONRY ===== */
    .modal-card-item .h-md { height: 220px; object-fit: cover; }
    .modal-card-item .h-lg { height: 280px; object-fit: cover; }
    .modal-card-item .h-xl { height: 340px; object-fit: cover; }

    .modal-card-item .item-label {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 8, 8, .8);
      backdrop-filter: blur(8px);

      touch-action: none;

    // LÓGICA DA APLICAÇÃO
    // ============================================================

    function getFavs() {
      try { return JSON.parse(localStorage.getItem('hairos_favorites') || '[]'); } catch { return []; }
    }

    function setFavs(arr) {
      try { localStorage.setItem('hairos_favorites', JSON.stringify(arr)); } catch {}
    }

    let favorites = getFavs();
    let currentFilter = 'all';
    let showingFavorites = false;
    let isSheetOpen = false;
    let isSheetFull = false;
    let currentKey = null;

    function updateFavCounter() {
      document.getElementById('favCount').textContent = favorites.length;
    }
    updateFavCounter();

    function isFav(key) { return favorites.includes(key); }

    function toggleFav(key, btn) {
      favorites = isFav(key) ? favorites.filter(k => k !== key) : [...favorites, key];
      setFavs(favorites);
      updateFavCounter();
      if (btn) {
        btn.classList.toggle('favorited', isFav(key));
        btn.textContent = isFav(key) ? '♥' : '♡';
      }
    }

    function shareStyle(key) {
      const data = styleData[key];
      if (!data) return;
      const text = `${data.corte} - ${data.title}\n${data.desc}\n\nVeja mais em HairOS!`;
      if (navigator.share) {
        navigator.share({ title: `HairOS - ${data.corte}`, text: text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text).then(() => {
          alert('Link copiado para compartilhar! 📋');
        }).catch(() => {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          alert('Link copiado para compartilhar! 📋');
        });
      }
    }

    function getFilteredKeys() {
      if (showingFavorites) return favorites;
      const keys = Object.keys(styleData);
      if (currentFilter === 'all') return keys;
      return keys.filter(key => styleData[key].categoria === currentFilter);
    }

    function goToHome() {
      if (showingFavorites) {
        showingFavorites = false;
        document.getElementById('favToggleBtn').classList.remove('active');
        document.getElementById('filters').classList.remove('hidden');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        currentFilter = 'all';
        renderHome();
      }
    }

    // ============================================================
    // RENDER HOME - MASONRY
    // ============================================================
    function renderHome() {
      const container = document.getElementById('masonryHome');
      const title = document.getElementById('sectionTitle');
      const vitrineBadge = document.getElementById('vitrineBadge');
      const brandSub = document.getElementById('brandSub');
      container.innerHTML = '';

      const filteredKeys = getFilteredKeys();

      if (showingFavorites) {
        title.innerHTML = `<span>✦</span> <span class="highlight">♥ Favoritos</span> <span>✦</span>`;
        vitrineBadge.classList.add('visible');
        brandSub.innerHTML = `✦ <span class="highlight">Vitrine de inspirações</span>`;
      } else {
        title.innerHTML = `<span>✦</span> <span class="highlight">Inspirações</span> <span>✦</span>`;
        vitrineBadge.classList.remove('visible');
        brandSub.innerHTML = `✦ <span class="highlight">Vitrine de inspirações</span>`;
      }

      if (filteredKeys.length === 0) {
        const isFavView = showingFavorites;
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${isFavView ? '💔' : '✨'}</div>
            <div class="empty-title">${isFavView ? 'Nenhum favorito' : 'Nenhum item encontrado'}</div>
            <div class="empty-sub">${isFavView ? 'Comece a favoritar seus estilos!' : 'Tente outra categoria'}</div>
            ${isFavView ? '<div class="empty-hint">Clique no ♥ nos cards para favoritar</div>' : ''}
          </div>
        `;
        return;
      }

      filteredKeys.forEach(key => {
        const data = styleData[key];
        if (!data) return;
        const fav = isFav(key);
        const altura = data.altura || 'h-md';

        const card = document.createElement('article');
        card.className = 'card-home';
        card.dataset.key = key;
        card.innerHTML = `
          <div class="card-home-actions">
            <button class="card-home-btn share-btn" data-key="${key}" title="Compartilhar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </button>
            <button class="card-home-btn fav-btn ${fav ? 'favorited' : ''}" data-key="${key}" title="Favoritar">${fav ? '♥' : '♡'}</button>
          </div>
          <div class="card-home-badge badge-${data.categoria}">${data.badge}</div>
          <img class="card-home-img ${altura}" src="${data.img}" alt="${data.corte}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'">
          <div class="card-home-title">${data.corte}</div>
        `;

        card.querySelector('.fav-btn').addEventListener('click', function(e) {
          e.stopPropagation();
          toggleFav(this.dataset.key, this);
          if (showingFavorites) renderHome();
        });

        card.querySelector('.share-btn').addEventListener('click', function(e) {
          e.stopPropagation();
          shareStyle(this.dataset.key);
        });

        card.addEventListener('click', () => openModal(key));
        container.appendChild(card);
      });
    }

    // ============================================================
    // RENDER MODAL MASONRY - COM ALTURAS VARIADAS (MOSAICO)
    // ============================================================
    function renderModalMasonry(key) {
      const container = document.getElementById('modalMasonry');
      container.innerHTML = '';

      const data = styleData[key];
      if (!data) return;

      let variants = data.variants || [data.img];
      while (variants.length < 10) {
        variants.push(VARIACOES_PINTEREST[variants.length % VARIACOES_PINTEREST.length]);
      }
      variants = variants.slice(0, 10);

      const alturasModal = ['h-md', 'h-lg', 'h-xl', 'h-md', 'h-lg', 'h-xl', 'h-md', 'h-lg', 'h-xl', 'h-md'];

      variants.forEach((imgUrl, idx) => {
        const hClass = alturasModal[idx % alturasModal.length];
        const card = document.createElement('div');
        card.className = 'modal-card-item';
        card.dataset.imgUrl = imgUrl;
        card.innerHTML = `
          <img class="${hClass}" src="${imgUrl}" alt="${data.corte}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'">
          <div class="item-label">#${idx + 1}</div>
        `;

        card.addEventListener('click', function(e) {
          e.stopPropagation();
          if (isSheetOpen) closeSheet();

          const imgSrc = this.dataset.imgUrl;

          let targetKey = null;
          for (let k in styleData) {
            const d = styleData[k];
            if (d && d.variants && d.variants.includes(imgSrc)) {
              targetKey = k;
              break;
            }
          }

          if (targetKey && targetKey !== key) {
            openModal(targetKey);
            return;
          }

          const heroImg = document.getElementById('modalImg');
          heroImg.classList.add('loading');
          heroImg.src = imgSrc;
          heroImg.onload = () => heroImg.classList.remove('loading');
          document.getElementById('modalOverlay').scrollTop = 0;
        });

        container.appendChild(card);
      });
    }

    // ============================================================
    // MODAL
    // ============================================================
    function openModal(key) {
      const data = styleData[key];
      if (!data) return;
      currentKey = key;
      if (isSheetOpen) closeSheet();

      const img = document.getElementById('modalImg');
      img.classList.add('loading');
      img.src = data.img;
      img.onload = () => img.classList.remove('loading');
      img.onerror = () => { img.src = FALLBACK_IMG; img.classList.remove('loading'); };

      document.getElementById('heroCategoria').textContent = data.badge;
      document.getElementById('heroTitle').textContent = data.corte;
      document.getElementById('heroSub').textContent = data.title;
      document.getElementById('sideCollection').textContent = data.categoria.charAt(0).toUpperCase() + data.categoria.slice(1);
      document.getElementById('sideYear').textContent = '2026';

      const isFavorited = isFav(key);
      heroFavBtn.classList.toggle('favorited', isFavorited);
      heroFavBtn.textContent = isFavorited ? '♥' : '♡';
      heroFavBtn.dataset.key = key;
      heroShareBtn.dataset.key = key;

      document.getElementById('sheetTitle').textContent = data.corte;
      document.getElementById('sheetSub').textContent = data.title;
      document.getElementById('sheetDesc').textContent = data.desc;

      document.getElementById('coloracaoItems').innerHTML = (data.coloracao || []).map(p =>
        `<a href="${p.link}" class="kit-item" target="_blank"><span>${p.name}</span><span class="ml-badge">ML</span></a>`
      ).join('');

      document.getElementById('cuidadosItems').innerHTML = (data.cuidados || []).map(p =>
        `<a href="${p.link}" class="kit-item" target="_blank"><span>${p.name}</span><span class="ml-badge">ML</span></a>`
      ).join('');

      document.getElementById('listaColoracao').classList.remove('show');
      document.getElementById('listaCuidados').classList.remove('show');

      renderModalMasonry(key);
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
      document.getElementById('modalOverlay').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      if (isSheetOpen) closeSheet();
      document.body.style.overflow = '';
      currentKey = null;
    }

    function openSheet() {
      document.getElementById('modalSheet').classList.add('show');
      document.getElementById('toggleSheetBtn').classList.add('hidden');
      isSheetOpen = true;
      document.getElementById('modalSheet').classList.remove('full');
      isSheetFull = false;
    }

    function closeSheet() {
      document.getElementById('modalSheet').classList.remove('show', 'full');
      document.getElementById('toggleSheetBtn').classList.remove('hidden');
      isSheetOpen = false;
      isSheetFull = false;
    }

    function toggleSheetFull() {
      if (!isSheetOpen) return;
      isSheetFull = !isSheetFull;
      document.getElementById('modalSheet').classList.toggle('full');
    }

    // ============================================================
    // ZOOM
    // ============================================================
    function toggleZoom() {
      const zo = document.getElementById('zoomOverlay');
      const zoomImg = document.getElementById('zoomImage');
      const heroImg = document.getElementById('modalImg');
      const sideLeft = document.getElementById('heroSideLeft');
      const sideRight = document.getElementById('heroSideRight');
      const closeBtn = document.getElementById('modalCloseBtn');
      const toggleBtn = document.getElementById('toggleSheetBtn');
      const heroInfo = document.getElementById('heroInfo');

      if (zo.classList.contains('active')) {
        zo.classList.remove('active');
        sideLeft.classList.remove('hidden');
        sideRight.classList.remove('hidden');
        closeBtn.classList.remove('hidden');
        toggleBtn.classList.remove('hidden');
        heroInfo.classList.remove('hidden');
      } else {
        zoomImg.src = heroImg.src;
        zo.classList.add('active');
        sideLeft.classList.add('hidden');
        sideRight.classList.add('hidden');
        closeBtn.classList.add('hidden');
        toggleBtn.classList.add('hidden');
        heroInfo.classList.add('hidden');
      }
    }

    // ============================================================
    // LOADING
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      const loadingScreen = document.getElementById('loadingScreen');
      const loadingBar = document.getElementById('loadingBar');
      const loadingPercent = document.getElementById('loadingPercent');
      const mainContent = document.getElementById('mainContent');

      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 8 + 2;
        if (progress > 100) progress = 100;
        loadingBar.style.width = progress + '%';
        loadingPercent.textContent = Math.round(progress) + '%';
        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            loadingScreen.classList.add('hidden');
            mainContent.classList.add('visible');
            renderHome();
          }, 400);
        }
      }, 120);

      setTimeout(() => {
        if (progress < 100) {
          progress = 100;
          loadingBar.style.width = '100%';
          loadingPercent.textContent = '100%';
        }
      }, 5000);
    });

    // ============================================================
    // EVENTOS
    // ============================================================
    document.getElementById('brandLogo').addEventListener('click', goToHome);
    document.getElementById('vitrineBadge').addEventListener('click', goToHome);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalImg').addEventListener('click', toggleZoom);
    document.getElementById('zoomOverlay').addEventListener('click', toggleZoom);
    document.getElementById('toggleSheetBtn').addEventListener('click', openSheet);
    document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
    document.getElementById('sheetHandle').addEventListener('click', toggleSheetFull);

    document.getElementById('favToggleBtn').addEventListener('click', function() {
      showingFavorites = !showingFavorites;
      this.classList.toggle('active', showingFavorites);
      const filters = document.getElementById('filters');
      if (showingFavorites) {
        filters.classList.add('hidden');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
      } else {
        filters.classList.remove('hidden');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        currentFilter = 'all';
      }
      renderHome();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        if (showingFavorites) {
          showingFavorites = false;
          document.getElementById('favToggleBtn').classList.remove('active');
          document.getElementById('filters').classList.remove('hidden');
        }
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderHome();
      });
    });

    document.getElementById('btnColoracao').addEventListener('click', function() {
      document.getElementById('listaCuidados').classList.remove('show');
      document.getElementById('listaColoracao').classList.toggle('show');
    });

    document.getElementById('btnCuidados').addEventListener('click', function() {
      document.getElementById('listaColoracao').classList.remove('show');
      document.getElementById('listaCuidados').classList.toggle('show');
    });

    const heroFavBtn = document.getElementById('heroFavBtn');
    const heroShareBtn = document.getElementById('heroShareBtn');

    heroFavBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const key = this.dataset.key;
      if (key) {
        toggleFav(key, this);
        if (showingFavorites) renderHome();
      }
    });

    heroShareBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const key = this.dataset.key;
      if (key) shareStyle(key);
    });

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (isSheetOpen) closeSheet();
        else closeModal();
        if (document.getElementById('zoomOverlay').classList.contains('active')) toggleZoom();
      }
    });

    // Sheet Drag
    let startY = 0;
    let isDragging = false;
    const handle = document.getElementById('sheetHandle');

    handle.addEventListener('touchstart', function(e) {
      startY = e.touches[0].clientY;
      isDragging = true;
    }, { passive: true });

    handle.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      const diff = startY - e.touches[0].clientY;
      if (diff > 40 && !isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
      if (diff < -40 && isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
    }, { passive: true });

    handle.addEventListener('touchend', function() {
      isDragging = false;
    }, { passive: true });

    // Hash routing
    function openFromHash() {
      const hash = location.hash || '';
      const m = hash.match(/card=([^&]+)/);
      if (!m) return;
      const key = decodeURIComponent(m[1]);
      if (styleData[key]) {
        setTimeout(() => openModal(key), 300);
      }
    }

    window.addEventListener('hashchange', openFromHash);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', openFromHash);
    } else {
      openFromHash();
    }
  </script>
</body>
</html>
