<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HairOS · Landing Page</title>
  <style>
    /* ===== IMPORTS ===== */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap');

    /* ===== RESET & VARIÁVEIS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0808;
      --bg-card: #1a1612;
      --text: #f0ebe4;
      --text-sec: #d4c9bc;
      --text-muted: #8a8278;
      --gold: #c9a96e;
      --gold-light: #e8d5a8;
      --gold-glow: rgba(201, 169, 110, .12);
      --border: rgba(201, 169, 110, .08);
      --radius: 14px;
      --transition: .35s cubic-bezier(.23, 1, .32, 1);
      --t6: .6s cubic-bezier(.23, 1, .32, 1);
    }

    html,
    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
    }
    .brand span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: .6rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ===== MASONRY HOME ===== */
    .masonry {
      column-count: 2;
      column-gap: 10px;
    }

    @media (min-width: 600px) {
      body {
        padding: 20px;
      }
      .masonry {
        column-count: 3;
        column-gap: 14px;
      }
    }

    @media (min-width: 900px) {
      .masonry {
        column-count: 4;
        column-gap: 16px;
      }
    }

    /* ===== CARDS ===== */
    .card {
      break-inside: avoid;
      margin-bottom: 10px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .card:hover {
      border-color: rgba(201, 169, 110, .25);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
    }

    .card-img {
      width: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform .5s ease;
    }

    .h-lg {
      height: 300px;
    }
    .h-xl {
      height: 360px;
    }
    .h-xxl {
      height: 420px;
    }

    .card:hover .card-img {
      transform: scale(1.03);
    }

    .card-action {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 8, 8, .75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201, 169, 110, .25);
      padding: 3px 8px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .card:hover .card-action {
      background: rgba(26, 22, 18, .95);
      border-color: var(--gold);
    }

    .card-action-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .65rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-action-btn {
      width: 14px;
      height: 14px;
      background: var(--gold-glow);
      border: 1px solid rgba(201, 169, 110, .3);
      border-radius: 50%;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .5rem;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .card:hover .card-action-btn {
      background: var(--gold);
      color: #0a0808;
      transform: scale(1.1);
    }

    .card-actions-top {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .card-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .4);
      font-size: .9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }

    .card-btn:hover {
      transform: scale(1.1);
    }
    .card-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .2);
    }
    .card-btn.share-btn {
      color: #4ecdc4;
    }
    .card-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    /* ===== MODAL FULLSCREEN ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      pointer-events: none;
      transition: background .5s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay.open {
      background: rgba(0, 0, 0, 1);
      pointer-events: auto;
    }

    .modal-overlay::-webkit-scrollbar {
      width: 4px;
    }
    .modal-overlay::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-overlay::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      background: var(--bg);
      border-radius: 0;
      opacity: 0;
      transition: opacity .5s ease;
      overflow: visible;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.open .modal-card {
      opacity: 1;
    }

    /* ===== HERO ===== */
    .modal-hero {
      position: relative;
      width: 100%;
      height: 70vh;
      max-height: 600px;
      min-height: 400px;
      overflow: hidden;
      background: var(--bg-card);
      flex-shrink: 0;
    }

    .modal-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: opacity .4s ease;
    }

    .modal-hero-img.loading {
      opacity: 0;
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 40px;
      height: 40px;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 71, 87, .3);
      color: #ff4757;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t6);
      z-index: 30;
    }

    .modal-close-btn:hover {
      background: #ff4757;
      color: #fff;
      transform: scale(1.08);
    }

    .modal-hero-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 30;
    }

    .modal-hero-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .15);
      color: rgba(255, 255, 255, .6);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .modal-hero-btn:hover {
      transform: scale(1.1);
    }
    .modal-hero-btn.favorited {
      color: #ff4757;
      background: rgba(255, 71, 87, .2);
      border-color: rgba(255, 71, 87, .3);
    }
    .modal-hero-btn.share-btn {
      color: #4ecdc4;
    }
    .modal-hero-btn.share-btn:hover {
      background: rgba(78, 205, 196, .2);
    }

    .modal-toggle-btn {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 12px 32px;
      border-radius: 30px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
      white-space: nowrap;
    }

    .modal-toggle-btn:hover {
      background: var(--gold);
      color: #0a0808;
      transform: translateX(-50%) scale(1.05);
    }

    .modal-toggle-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }

    /* ===== SHEET ===== */
    .modal-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 500px;
      margin: 0 auto;
      height: 60%;
      min-height: 300px;
      max-height: 90%;
      background: rgba(10, 8, 8, .98);
      backdrop-filter: blur(24px);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 30px;
      transform: translateY(100%);
      transition: transform var(--t6), height var(--t6);
      z-index: 150;
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(201, 169, 110, .15);
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .8);
    }

    .modal-sheet.show {
      transform: translateY(0);
    }
    .modal-sheet.full {
      height: 90%;
      border-radius: 0;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, .2);
      border-radius: 4px;
      margin: 0 auto 16px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background .3s;
    }

    .sheet-handle:hover {
      background: rgba(255, 255, 255, .4);
    }
    .sheet-handle:active {
      cursor: grabbing;
    }

    .sheet-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-right: -4px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
    }

    .sheet-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .sheet-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .sheet-scroll::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .sheet-header h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }

    .sheet-header .sub {
      font-size: .9rem;
      color: var(--gold);
      font-weight: 400;
      margin-top: 2px;
    }

    .sheet-close-btn {
      background: rgba(255, 71, 87, .1);
      border: 1px solid rgba(255, 71, 87, .3);
      color: #ff4757;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t6);
      flex-shrink: 0;
    }

    .sheet-close-btn:hover {
      background: #ff4757;
      color: #fff;
    }

    .sheet-desc {
      font-size: .85rem;
      color: var(--text-sec);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .sheet-btns button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(201, 169, 110, .25);
      background: var(--gold-glow);
      color: var(--gold-light);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
    }

    .sheet-btns button.cuidados {
      background: rgba(46, 204, 113, .08);
      border-color: rgba(46, 204, 113, .2);
      color: #2ecc71;
    }

    .sheet-btns button:hover {
      opacity: .85;
      transform: scale(1.02);
    }

    .kit-lista {
      display: none;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: rgba(201, 169, 110, .04);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .kit-lista.show {
      display: block;
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .kit-lista .kit-title {
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gold);
      opacity: .7;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .kit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-sec);
      font-size: .8rem;
      transition: color .2s;
    }

    .kit-item:last-child {
      border-bottom: none;
    }
    .kit-item:hover {
      color: var(--text);
    }
    .kit-item span {
      color: var(--gold);
      opacity: .6;
    }

    .sheet-cta {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #0a0808;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: .9rem;
      text-align: center;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--t6);
      text-decoration: none;
      margin-top: 8px;
    }

    .sheet-cta:hover {
      background: var(--gold-light);
      transform: scale(1.01);
    }

    /* ===== CONTEÚDO ABAIXO DO HERO ===== */
    .modal-content {
      padding: 20px 16px 40px;
      flex: 1;
    }

    .modal-section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-sec);
      margin-bottom: 16px;
      text-align: center;
      opacity: .7;
      letter-spacing: 2px;
    }

    .modal-content .masonry {
      column-count: 2;
      column-gap: 10px;
    }

    @media (min-width: 600px) {
      .modal-content .masonry {
        column-count: 3;
        column-gap: 14px;
      }
    }

    @media (min-width: 900px) {
      .modal-content .masonry {
        column-count: 4;
        column-gap: 16px;
      }
    }

    /* ===== CARDS DENTRO DO MODAL ===== */
    .modal-content .card {
      margin-bottom: 10px;
      border-color: rgba(201, 169, 110, .06);
      border-radius: 12px;
    }

    .modal-content .card:hover {
      border-color: rgba(201, 169, 110, .3);
      transform: translateY(-2px);
    }

    .modal-content .card .card-img {
      height: 120px;
    }

    .modal-content .card .h-lg {
      height: 160px;
    }
    .modal-content .card .h-xl {
      height: 200px;
    }
    .modal-content .card .h-xxl {
      height: 240px;
    }

    .modal-content .card .card-actions-top {
      display: none !important;
    }

    .modal-content .card .card-action {
      display: none !important;
    }

    /* ===== UTILITÁRIOS ===== */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-style: italic;
      column-span: all;
    }
  </style>
</head>
<body>

    <div>
      <div class="brand">Hair<span>OS</span></div>
      <div class="brand-sub">Inspiração</div>
    </div>
  </header>

  <div class="masonry" id="masonry"></div>

  <!-- ===== MODAL FULLSCREEN ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">

        <button class="modal-toggle-btn" id="toggleSheetBtn">Ver Detalhes</button>
      </div>

      <div class="modal-content">
        <div class="modal-section-title" id="modalSectionTitle">✦ Variações ✦</div>
        <div class="masonry" id="modalMasonry"></div>
      </div>
    </div>
  </div>

  <div class="modal-sheet" id="modalSheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-scroll" id="sheetScroll">
      <div class="sheet-header">
        <div>
          <h2 id="sheetTitle">Pixie</h2>

      <p class="sheet-desc" id="sheetDesc">Descrição do estilo</p>

      <div class="kit-lista" id="listaCuidados">

        <div id="cuidadosItems"></div>
      </div>
      <a href="#" class="sheet-cta" id="sheetCta">Ver todos os produtos</a>
      <div style="height:20px;"></div>
    </div>
  </div>

    // ===== FAVORITOS =====
    function getFavs() {
      try { return JSON.parse(localStorage.getItem('hairos_favorites') || '[]'); } catch { return []; }
    }

    function setFavs(arr) {
      try { localStorage.setItem('hairos_favorites', JSON.stringify(arr)); } catch {}
    }

    let favorites = getFavs();

    function isFav(key) { return favorites.includes(key); }

    function toggleFav(key, btn) {
      favorites = isFav(key) ?
        favorites.filter(k => k !== key) :
        [...favorites, key];
      setFavs(favorites);
      if (btn) {
        btn.classList.toggle('favorited', isFav(key));
        btn.textContent = isFav(key) ? '♥' : '♡';
      }
    }

    // ===== COMPARTILHAR =====
    function shareStyle(key) {
      const data = styleData[key];
      if (!data) return;

      const text = `${data.corte} - ${data.title}\n${data.desc}\n\nVeja mais em HairOS!`;

      if (navigator.share) {
        navigator.share({
          title: `HairOS - ${data.corte}`,
          text: text,
          url: window.location.href
        }).catch(() => {});
      } else {
        const fullText = `${text}\n${window.location.href}`;
        navigator.clipboard.writeText(fullText).then(() => {
          alert('Link copiado para compartilhar!');
        }).catch(() => {
          const textarea = document.createElement('textarea');
          textarea.value = fullText;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          alert('Link copiado para compartilhar!');
        });
      }
    }

    // ===== RENDER HOME =====
    function renderMasonry() {
      const container = document.getElementById('masonry');
      container.innerHTML = '';
      const heights = ['h-lg', 'h-xl', 'h-xxl', 'h-lg', 'h-xl', 'h-xxl', 'h-lg', 'h-xl', 'h-xxl'];
      const keys = Object.keys(styleData);

      keys.forEach((key, idx) => {
        const data = styleData[key];
        const fav = isFav(key);
        const hClass = heights[idx % heights.length];

        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.key = key;
        card.innerHTML = `
          <div class="card-actions-top">
            <button class="card-btn share-btn" data-key="${key}" title="Compartilhar">↗</button>
            <button class="card-btn fav-btn ${fav ? 'favorited' : ''}" data-key="${key}" title="Favoritar">${fav ? '♥' : '♡'}</button>
          </div>
          <img class="card-img ${hClass}" src="${data.img}" alt="${data.corte}" loading="lazy">
          <div class="card-action">
            <span class="card-action-title">${data.corte}</span>
            <div class="card-action-btn">→</div>
          </div>
        `;

        const favBtn = card.querySelector('.fav-btn');
        favBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleFav(this.dataset.key, this);
        });

        const shareBtn = card.querySelector('.share-btn');
        shareBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          shareStyle(this.dataset.key);
        });

        card.addEventListener('click', () => openModal(key));
        container.appendChild(card);
      });
    }

    // ===== RENDER MASONRY DENTRO DO MODAL =====
    function renderModalMasonry(key) {
      const container = document.getElementById('modalMasonry');
      container.innerHTML = '';
      
      const data = styleData[key];
      if (!data) return;

      document.getElementById('modalSectionTitle').textContent = `✦ Variações ${data.corte} ✦`;

      const variants = data.variants || [data.img];
      const heights = ['h-lg', 'h-xl', 'h-xxl', 'h-lg', 'h-xl', 'h-xxl'];

      variants.forEach((imgUrl, idx) => {
        const hClass = heights[idx % heights.length];

        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.key = key;
        card.dataset.variant = idx;
        card.innerHTML = `
          <img class="card-img ${hClass}" src="${imgUrl}" alt="${data.corte}" loading="lazy">
        `;

        card.addEventListener('click', function(e) {
          if (isSheetOpen) {
            closeSheet();
          }
          
          const heroImg = document.getElementById('modalImg');
          heroImg.classList.add('loading');
          heroImg.src = imgUrl;
          heroImg.onload = () => heroImg.classList.remove('loading');
          
          document.getElementById('modalOverlay').scrollTop = 0;
        });

        container.appendChild(card);
      });
    }

    // ===== MODAL =====
    const overlay = document.getElementById('modalOverlay');
    const sheet = document.getElementById('modalSheet');
    const toggleBtn = document.getElementById('toggleSheetBtn');
    const heroFavBtn = document.getElementById('heroFavBtn');
    const heroShareBtn = document.getElementById('heroShareBtn');
    let isSheetOpen = false;
    let isSheetFull = false;
    let currentKey = null;

    function openModal(key) {
      const data = styleData[key];
      if (!data) return;

      currentKey = key;

      if (isSheetOpen) closeSheet();

      const img = document.getElementById('modalImg');
      img.classList.add('loading');
      img.src = data.img;
      img.onload = () => img.classList.remove('loading');

      const isFavorited = isFav(key);
      heroFavBtn.classList.toggle('favorited', isFavorited);
      heroFavBtn.textContent = isFavorited ? '♥' : '♡';
      heroFavBtn.dataset.key = key;
      heroShareBtn.dataset.key = key;

      document.getElementById('sheetTitle').textContent = data.corte;
      document.getElementById('sheetSub').textContent = data.title;
      document.getElementById('sheetDesc').textContent = data.desc;

      document.getElementById('coloracaoItems').innerHTML = (data.coloracao || []).map(p =>
        `<a href="${p.link}" class="kit-item" target="_blank" rel="noopener"><span>${p.name}</span><span>→</span></a>`
      ).join('');

      document.getElementById('cuidadosItems').innerHTML = (data.cuidados || []).map(p =>
        `<a href="${p.link}" class="kit-item" target="_blank" rel="noopener"><span>${p.name}</span><span>→</span></a>`
      ).join('');

      document.getElementById('listaColoracao').classList.remove('show');
      document.getElementById('listaCuidados').classList.remove('show');

      renderModalMasonry(key);

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      overlay.scrollTop = 0;
    }

    function closeModal() {
      overlay.classList.remove('open');
      if (isSheetOpen) closeSheet();
      document.body.style.overflow = '';
      currentKey = null;
    }

    // ===== SHEET =====
    function openSheet() {
      sheet.classList.add('show');
      toggleBtn.classList.add('hidden');
      isSheetOpen = true;
      sheet.classList.remove('full');
      isSheetFull = false;
    }

    function closeSheet() {
      sheet.classList.remove('show', 'full');
      toggleBtn.classList.remove('hidden');
      isSheetOpen = false;
      isSheetFull = false;
    }

    function toggleSheetFull() {
      if (!isSheetOpen) return;
      isSheetFull = !isSheetFull;
      sheet.classList.toggle('full');
    }

    // ===== EVENTOS =====
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    toggleBtn.addEventListener('click', openSheet);
    document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
    document.getElementById('sheetHandle').addEventListener('click', toggleSheetFull);

    heroFavBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const key = this.dataset.key;
      if (key) {
        toggleFav(key, this);
      }
    });

    heroShareBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const key = this.dataset.key;
      if (key) {
        shareStyle(key);
      }
    });

    overlay.addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (isSheetOpen) closeSheet();
        else closeModal();
      }
    });

    // ===== KITS =====
    document.getElementById('btnColoracao').addEventListener('click', function() {
      document.getElementById('listaCuidados').classList.remove('show');
      document.getElementById('listaColoracao').classList.toggle('show');
    });

    document.getElementById('btnCuidados').addEventListener('click', function() {
      document.getElementById('listaColoracao').classList.remove('show');
      document.getElementById('listaCuidados').classList.toggle('show');
    });

    // ===== DRAG SHEET =====
    let startY = 0;
    let isDragging = false;

    const handle = document.getElementById('sheetHandle');

    handle.addEventListener('touchstart', function(e) {
      startY = e.touches[0].clientY;
      isDragging = true;
    }, { passive: true });

    handle.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      const diff = startY - e.touches[0].clientY;
      if (diff > 40 && !isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
      if (diff < -40 && isSheetFull && isSheetOpen) {
        toggleSheetFull();
        isDragging = false;
      }
    }, { passive: true });

    handle.addEventListener('touchend', function() {
      isDragging = false;
    }, { passive: true });

    // ===== INIT =====
    renderMasonry();
  </script>
