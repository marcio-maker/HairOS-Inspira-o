<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairOS · Assistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0808;
      --surface: #12100e;
      --surface2: #1a1612;
      --gold: #c9a96e;
      --gold-dim: rgba(201,169,110,0.15);
      --gold-light: #e8d5a8;
      --text: #f0ebe4;
      --text-sec: #d4c9bc;
      --muted: #8a8278;
      --border: rgba(255,255,255,0.04);
      --border-gold: rgba(201,169,110,0.12);
      --user: #1a1612;
      --bot: #12100e;
      --green: #3d9a6a;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      flex-shrink: 0;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8b6914);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #0a0808;
      font-weight: 700;
    }
    .header-info h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .header-info p {
      font-size: 11px;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.04em;
      opacity: 0.6;
    }
    .header-status {
      margin-left: auto;
      font-size: 10px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .header-status::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .header-link {
      margin-left: 6px;
      font-size: 11px;
      color: var(--gold);
      text-decoration: none;
      padding: 5px 14px;
      border: 1px solid var(--border-gold);
      border-radius: 100px;
      white-space: nowrap;
      transition: all 0.3s;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-family: 'Inter', sans-serif;
    }
    .header-link:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar {
      width: 3px;
    }
    .chat::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }
    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn .3s ease;
      font-weight: 300;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid var(--border-gold);
      border-bottom-right-radius: 4px;
    }
    .msg strong {
      color: var(--gold);
      font-weight: 600;
    }
    
    /* Result Card */
    .result-card {
      margin-top: 10px;
      background: var(--surface2);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      overflow: hidden;
    }
    .result-card .body { padding: 14px; }
    .result-card .badge {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gold);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .result-card h3 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      margin-bottom: 6px;
      color: var(--text);
    }
    .result-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.5;
      font-weight: 300;
    }
    .result-card .result-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .result-card a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      width: 100%;
    }
    .result-card a.btn-ml {
      background: var(--gold);
      color: #0a0808;
      border: none;
    }
    .result-card a.btn-ml:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--gold-dim);
    }
    .result-card a.btn-vitrine {
      background: var(--surface2);
      border: 1px solid var(--border-gold);
      color: var(--gold);
    }
    .result-card a.btn-vitrine:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    /* Quick Actions */
    .quick {
      flex-shrink: 0;
      padding: 10px 12px 6px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid var(--border);
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .quick::-webkit-scrollbar {
      display: none;
    }
    .quick button {
      flex-shrink: 0;
      padding: 7px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.04em;
    }
    .quick button:active,
    .quick button:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-dim);
    }
    
    /* Options inside chat */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .options button {
      text-align: left;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .options button:active,
    .options button:hover {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
    }
    .options button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--border);
      background: transparent;
      color: var(--muted);
    }

    /* Composer */
    .composer {
      flex-shrink: 0;
      padding: 10px 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      max-height: 100px;
      outline: none;
      transition: border 0.2s;
    }
    .composer textarea:focus {
      border-color: var(--gold);
    }
    .composer textarea::placeholder {
      color: var(--muted);
      opacity: 0.4;
    }
    .composer button.send {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--gold);
      color: #0a0808;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .composer button.send:hover {
      background: var(--gold-light);
      transform: scale(1.03);
    }
    .composer button.send:active {
      transform: scale(0.95);
    }

    .chat {
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
    }
  </style>
</head>
<body>

      if (a[0] === 'castanho' && a[3] === 'frio') return 'mocha-mousse';
      if (a[0] === 'castanho' && a[1] === 'media') return 'caramelo-glow';
      if (a[0] === 'escuro' && a[3] === 'quente') return 'expensive-brunette';
      if (a[0] === 'escuro' && a[3] === 'frio') return 'mushroom-brown';
      if (a[0] === 'escuro') return 'chocolate-intenso';
      return 'balayage';
    },
    tipo: 'cores', label: 'Cor sugerida'
  },
  produto: {
    titulo: 'Quiz de Produto',
    perguntas: [
      { q: 'Qual a maior queixa do seu cabelo hoje?', opcoes: [{ t: 'Ressecado / sem brilho', v: 'seco' }, { t: 'Quebrando / elastico', v: 'danificado' }, { t: 'Cor desbotando', v: 'cor' }, { t: 'Opaco / agua pesada', v: 'metais' }, { t: 'Amarelou', v: 'amarelo' }, { t: 'Cachos sem definicao', v: 'cacho' }, { t: 'Queda ou afinamento', v: 'queda' }, { t: 'Frizz / arrepiado', v: 'frizz' }] },
      { q: 'Voce faz coloracao com frequencia?', opcoes: [{ t: 'Sim', v: 'sim' }, { t: 'As vezes', v: 'asvezes' }, { t: 'Nao', v: 'nao' }] },
      { q: 'Usa chapinha, secador ou babyliss?', opcoes: [{ t: 'Todo dia / quase todo dia', v: 'muito' }, { t: 'As vezes', v: 'medio' }, { t: 'Raramente', v: 'pouco' }] },
      { q: 'Prefere rotina simples ou tratamento semanal?', opcoes: [{ t: 'Simples (shampoo + cond)', v: 'simples' }, { t: 'Com mascara 1x por semana', v: 'mascara' }, { t: 'Protocolo completo', v: 'completo' }] },
    ],
    resolver(a) {
      if (a[0] === 'metais') return 'metal-detox';
      if (a[0] === 'amarelo') return 'blondifier';
      if (a[0] === 'cacho') return 'curl-expression';
      if (a[0] === 'queda') return 'pro-longer';
      if (a[0] === 'frizz') return 'liss-unlimited';
      if (a[0] === 'cor' || a[1] === 'sim') return 'vitamino-color';
      if (a[0] === 'danificado' || a[2] === 'muito') return 'absolut-repair-shampoo';
      if (a[0] === 'seco') return 'joico-moisture-shampoo';
      return 'joico-moisture-shampoo';
    },
    tipo: 'produtos', label: 'Produto sugerido'
  },
  kit: {
    titulo: 'Quiz de Kit',
    perguntas: [
      { q: 'Qual o foco principal agora?', opcoes: [{ t: 'Hidratacao e maciez', v: 'hidro' }, { t: 'Reconstrucao / forca', v: 'recon' }, { t: 'Manter loiro limpo', v: 'loiro' }, { t: 'Proteger a coloracao', v: 'cor' }, { t: 'Detox / limpeza profunda', v: 'detox' }, { t: 'Cachos definidos', v: 'cacho' }, { t: 'Crescimento / queda', v: 'crescimento' }, { t: 'Cuidado diario', v: 'diario' }] },
      { q: 'Seu cabelo passou por quimica recente?', opcoes: [{ t: 'Sim', v: 'sim' }, { t: 'Nao', v: 'nao' }] },
      { q: 'Quantos passos voce aceita na rotina?', opcoes: [{ t: '2 (shampoo + cond)', v: '2' }, { t: '3 (com mascara)', v: '3' }, { t: '4+ (leave-in, oleo...)', v: '4' }] },
      { q: 'Orcamento aproximado para um kit?', opcoes: [{ t: 'Ate R$ 150', v: 'baixo' }, { t: 'R$ 150–300', v: 'medio' }, { t: 'Acima de R$ 300', v: 'alto' }] },
    ],
    resolver(a) {
      if (a[0] === 'detox') return 'kit-detox';
      if (a[0] === 'loiro') return 'kit-loiros';
      if (a[0] === 'cor' || a[1] === 'sim') return 'kit-pos-coloracao';
      if (a[0] === 'hidro') return 'kit-hidratacao';
      if (a[0] === 'recon') return 'kit-reconstrucao';
      if (a[0] === 'cacho') return 'kit-cacheados';
      if (a[0] === 'crescimento') return 'kit-crescimento';
      if (a[0] === 'diario') return 'kit-uso-diario';
      return 'kit-hidratacao';
    },
    tipo: 'kits', label: 'Kit sugerido'
  }
};

const DUVIDAS = [
  { q: 'Como escolher o corte ideal?', a: 'O corte ideal depende do formato do seu rosto e textura. Use nosso <strong>Quiz de Corte</strong> no menu superior para receber uma recomendacao personalizada baseada no seu perfil!' },
  { q: 'Qual cor nao agride tanto o fio?', a: 'Tecnicas como <strong>Balayage</strong> e <strong>Morena Iluminada</strong> agridem menos, pois nao aplicam descolorante na raiz e mantem a base natural. Use sempre o <strong>Kit Pos-Coloracao</strong> para manter a saude!' },
  { q: 'Os produtos sao originais?', a: 'Sim! Trabalhamos apenas com distribuidores oficiais e parceiros certificados. Todos os produtos sao 100% originais e lacrados.' },
  { q: 'Qual o prazo de entrega?', a: 'O prazo varia conforme sua regiao e e calculado diretamente no checkout do <strong>Mercado Livre</strong>, garantindo seguranca e rastreio em cada etapa.' }
];

/* ============================================================
   ESTADO E CONTROLE DE FLUXO
   ============================================================ */
let state = { mode: 'idle', quiz: null, step: 0, answers: [] };

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');

function addMsg(text, sender, extraHtml = '') {
  const div = document.createElement('div');
  div.className = `msg ${sender}`;
  div.innerHTML = `${text} ${extraHtml}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function resetState() {
  state.mode = 'idle';
  state.quiz = null;
  state.step = 0;
  state.answers = [];
}

/* ============================================================
   FLUXO DOS QUIZZES
   ============================================================ */
function startQuiz(tipo) {
  resetState();
  state.mode = 'quiz';
  state.quiz = tipo;
  addMsg(`Vamos iniciar o <strong>${QUIZZES[tipo].titulo}</strong>! Responda as perguntas para receber sua recomendacao personalizada.`, 'bot');
  setTimeout(askNextQuestion, 600);
}

function askNextQuestion() {
  const qData = QUIZZES[state.quiz];
  if (state.step >= qData.perguntas.length) {
    const key = qData.resolver(state.answers);
    showResult(qData.tipo, key, qData.label);
    return;
  }
  const p = qData.perguntas[state.step];
  let optsHtml = '<div class="options">';
  p.opcoes.forEach((op, i) => {
    optsHtml += `<button data-action="opt-${i}">${op.t}</button>`;
  });
  optsHtml += '</div>';
  addMsg(p.q, 'bot', optsHtml);
}

/* ============================================================
   FUNCAO PRINCIPAL: showResult COM 2 BOTOES PARA CORTES E CORES
   ============================================================ */
function showResult(tipo, key, label) {
  const item = CATALOGO[tipo][key];
  if (!item) return;
  
  const mlQuery = encodeURIComponent(item.ml);
  const mlLink = `https://www.mercadolivre.com.br/busca?word=${mlQuery}`;
  
  // Link para a vitrine (index.html com hash)
  const vitrineLink = `index.html#card=${key}`;
  
  // Define se mostra 2 botoes (cortes e cores) ou 1 (produtos e kits)
  const isCorteOuCor = (tipo === 'cortes' || tipo === 'cores');
  
  let botoesHtml = '';
  if (isCorteOuCor) {
    botoesHtml = `
      <a href="${vitrineLink}" class="btn-vitrine" target="_blank">Ver na Vitrine</a>
      <a href="${mlLink}" class="btn-ml" target="_blank" rel="noopener">Ver no Mercado Livre</a>
    `;
  } else {
    botoesHtml = `
      <a href="${mlLink}" class="btn-ml" target="_blank" rel="noopener">Ver no Mercado Livre</a>
    `;
  }
  
  const cardHtml = `
    <div class="result-card">
      <div class="body">
        <div class="badge">${label}</div>
        <h3>${item.nome}</h3>
        <p>${item.desc}</p>
        <div class="result-actions">
          ${botoesHtml}
        </div>
      </div>
    </div>
  `;
  
  addMsg('Encontrei a recomendacao perfeita para voce!', 'bot', cardHtml);
  resetState();
}

/* ============================================================
   FLUXO DE DUVIDAS
   ============================================================ */
function showDuvidasMenu() {
  resetState();
  let html = '<div class="options">';
  DUVIDAS.forEach((d, i) => {
    html += `<button data-action="doubt-${i}">${d.q}</button>`;
  });
  html += '</div>';
  addMsg('Qual sua duvida? Escolha uma das opcoes abaixo:', 'bot', html);
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  
  const action = btn.dataset.action;

  if (action === 'quiz-corte') return startQuiz('corte');
  if (action === 'quiz-cor') return startQuiz('cor');
  if (action === 'quiz-produto') return startQuiz('produto');
  if (action === 'quiz-kit') return startQuiz('kit');
  if (action === 'duvidas') return showDuvidasMenu();
  
  if (action.startsWith('opt-') && state.mode === 'quiz') {
    const idx = parseInt(action.split('-')[1]);
    const val = QUIZZES[state.quiz].perguntas[state.step].opcoes[idx].v;
    state.answers.push(val);
    state.step++;
    
    btn.closest('.options').querySelectorAll('button').forEach(b => b.disabled = true);
    
    setTimeout(askNextQuestion, 500);
    return;
  }

  if (action.startsWith('doubt-')) {
    const idx = parseInt(action.split('-')[1]);
    addMsg(DUVIDAS[idx].a, 'bot');
    resetState();
    return;
  }
});

document.getElementById('sendBtn').addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  
  addMsg(text, 'user');
  inputEl.value = '';
  
  if (state.mode === 'quiz') return;

  const lower = text.toLowerCase();
  if (lower.includes('corte')) return startQuiz('corte');
  if (lower.includes('cor') || lower.includes('mecha') || lower.includes('color')) return startQuiz('cor');
  if (lower.includes('produto') || lower.includes('shampoo') || lower.includes('creme')) return startQuiz('produto');
  if (lower.includes('kit')) return startQuiz('kit');
  if (lower.includes('duvida') || lower.includes('ajuda')) return showDuvidasMenu();
  
  addMsg('Posso te ajudar com um <strong>Quiz de Corte, Cor, Produto ou Kit</strong>, ou tirar suas <strong>Duvidas</strong>. Use os botoes acima ou digite o que precisa!', 'bot');
}

/* ============================================================
   MENSAGEM INICIAL
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    addMsg('Ola! Sou o <strong>HairOS</strong>, seu assistente de beleza.<br><br>Posso te ajudar a descobrir o corte, cor ou produto ideal atraves dos nossos <strong>Quizzes</strong>, ou tirar duvidas rapidas. Como posso te ajudar hoje?', 'bot');
  }, 400);
});
</script>
