<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairOS · Assistente</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #16161a;
      --surface2: #1e1e24;
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,0.15);
      --gold-light: #e8d5a8;
      --text: #f5f5f7;
      --muted: #9a9aa3;
      --border: rgba(255,255,255,0.08);
      --user: #2a2a32;
      --bot: #1a1a20;
      --green: #3d9a6a;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      flex-shrink: 0;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8b6914);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-info h1 { font-size: 15px; font-weight: 600; }
    .header-info p { font-size: 12px; color: var(--muted); }
    .header-status {
      margin-left: auto;
      font-size: 11px;
      color: var(--green);
      display: flex; align-items: center; gap: 5px;
    }
    .header-status::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
    }
    .header-link {
      margin-left: 12px;
      font-size: 11px;
      color: var(--gold);
      text-decoration: none;
      padding: 5px 12px;
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: 20px;
      white-space: nowrap;
      transition: all 0.3s;
    }
    .header-link:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.45;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 4px;
    }
    .msg strong { color: var(--gold); }
    
    /* Result Card */
    .result-card {
      margin-top: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .result-card .body { padding: 14px; }
    .result-card .badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .result-card h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
    .result-card p { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.4; }
    .result-card .result-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .result-card a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }
    /* Botão Principal Mercado Livre */
    .result-card a.btn-ml {
      background: var(--gold);
      color: #111;
      border: none;
      width: 100%;
    }
    .result-card a.btn-ml:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(201,168,76,0.3);
    }

    /* Quick Actions */
    .quick {
      flex-shrink: 0;
      padding: 10px 12px 6px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid var(--border);
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }
    .quick button {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .quick button:active, .quick button:hover { border-color: var(--gold); color: var(--gold); }
    
    /* Options inside chat */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .options button {
      text-align: left;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .options button:active,
    .options button:hover {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
    }

    /* Composer */
    .composer {
      flex-shrink: 0;
      padding: 10px 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      max-height: 100px;
      outline: none;
    }
    .composer textarea:focus { border-color: var(--gold); }
    .composer button.send {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--gold);
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header class="header">

    perguntas: [
      { q: 'Qual o foco principal agora?', opcoes: [{ t: 'Hidratação e maciez', v: 'hidro' }, { t: 'Reconstrução / força', v: 'recon' }, { t: 'Manter loiro limpo', v: 'loiro' }, { t: 'Proteger a coloração', v: 'cor' }, { t: 'Detox / limpeza profunda', v: 'detox' }, { t: 'Cachos definidos', v: 'cacho' }, { t: 'Crescimento / queda', v: 'crescimento' }, { t: 'Cuidado diário', v: 'diario' }] },
      { q: 'Seu cabelo passou por química recente?', opcoes: [{ t: 'Sim', v: 'sim' }, { t: 'Não', v: 'nao' }] },
      { q: 'Quantos passos você aceita na rotina?', opcoes: [{ t: '2 (shampoo + cond)', v: '2' }, { t: '3 (com máscara)', v: '3' }, { t: '4+ (leave-in, óleo...)', v: '4' }] },
      { q: 'Orçamento aproximado para um kit?', opcoes: [{ t: 'Até R$ 150', v: 'baixo' }, { t: 'R$ 150–300', v: 'medio' }, { t: 'Acima de R$ 300', v: 'alto' }] },
    ],
    resolver(a) {
      if (a[0] === 'detox') return 'kit-detox';
      if (a[0] === 'loiro') return 'kit-loiros';
      if (a[0] === 'cor' || a[1] === 'sim') return 'kit-pos-coloracao';
      if (a[0] === 'hidro') return 'kit-hidratacao';
      if (a[0] === 'recon') return 'kit-reconstrucao';
      if (a[0] === 'cacho') return 'kit-cacheados';
      if (a[0] === 'crescimento') return 'kit-crescimento';
      if (a[0] === 'diario') return 'kit-uso-diario';
      return 'kit-hidratacao';
    },
    tipo: 'kits', label: 'Kit sugerido'
  }
};

const DUVIDAS = [
  { q: '💇‍♀️ Como escolher o corte ideal?', a: 'O corte ideal depende do formato do seu rosto e textura. Use nosso <strong>Quiz de Corte</strong> no menu superior para receber uma recomendação personalizada baseada no seu perfil!' },
  { q: '🎨 Qual cor não agride tanto o fio?', a: 'Técnicas como <strong>Balayage</strong> e <strong>Morena Iluminada</strong> agridem menos, pois não aplicam descolorante na raiz e mantêm a base natural. Use sempre o <strong>Kit Pós-Coloração</strong> para manter a saúde!' },
  { q: '🧴 Os produtos são originais?', a: 'Sim! Trabalhamos apenas com distribuidores oficiais e parceiros certificados. Todos os produtos são 100% originais e lacrados.' },
  { q: '📦 Qual o prazo de entrega?', a: 'O prazo varia conforme sua região e é calculado diretamente no checkout do <strong>Mercado Livre</strong>, garantindo segurança e rastreio em cada etapa.' }
];

/* ============================================================
   ESTADO E CONTROLE DE FLUXO (Correção do Bug de Mensagens)
   ============================================================ */
let state = { mode: 'idle', quiz: null, step: 0, answers: [] };

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');

function addMsg(text, sender, extraHtml = '') {
  const div = document.createElement('div');
  div.className = `msg ${sender}`;
  div.innerHTML = `${text} ${extraHtml}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function resetState() {
  state.mode = 'idle';
  state.quiz = null;
  state.step = 0;
  state.answers = [];
}

/* ============================================================
   FLUXO DOS QUIZZES
   ============================================================ */
function startQuiz(tipo) {
  resetState(); // Garante que não há resíduos de outros fluxos
  state.mode = 'quiz';
  state.quiz = tipo;
  addMsg(`Vamos iniciar o <strong>${QUIZZES[tipo].titulo}</strong>! Responda às perguntas para receber sua recomendação personalizada. ✨`, 'bot');
  setTimeout(askNextQuestion, 600);
}

function askNextQuestion() {
  const qData = QUIZZES[state.quiz];
  if (state.step >= qData.perguntas.length) {
    const key = qData.resolver(state.answers);
    showResult(qData.tipo, key, qData.label);
    return;
  }
  const p = qData.perguntas[state.step];
  let optsHtml = '<div class="options">';
  p.opcoes.forEach((op, i) => {
    optsHtml += `<button data-action="opt-${i}">${op.t}</button>`;
  });
  optsHtml += '</div>';
  addMsg(p.q, 'bot', optsHtml);
}

function showResult(tipo, key, label) {
  const item = CATALOGO[tipo][key];
  if (!item) return;
  
  // Gera o link de busca direto para o Mercado Livre
  const mlQuery = encodeURIComponent(item.ml);
  const mlLink = `https://www.mercadolivre.com.br/busca?word=${mlQuery}`;
  
  const cardHtml = `
    <div class="result-card">
      <div class="body">
        <div class="badge">${label}</div>
        <h3>${item.nome}</h3>
        <p>${item.desc}</p>
        <div class="result-actions">
          <a href="${mlLink}" class="btn-ml" target="_blank" rel="noopener">🛒 Ver no Mercado Livre</a>
        </div>
      </div>
    </div>
  `;
  
  addMsg(`✨ Encontrei a recomendação perfeita para você!`, 'bot', cardHtml);
  
  // IMPORTANTE: Reseta o estado para evitar mensagens extras ou bugs
  resetState();
}

/* ============================================================
   FLUXO DE DÚVIDAS
   ============================================================ */
function showDuvidasMenu() {
  resetState();
  let html = '<div class="options">';
  DUVIDAS.forEach((d, i) => {
    html += `<button data-action="doubt-${i}">${d.q}</button>`;
  });
  html += '</div>';
  addMsg('Qual sua dúvida? Escolha uma das opções abaixo:', 'bot', html);
}

/* ============================================================
   EVENT LISTENERS (Cliques e Envio de Texto)
   ============================================================ */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  
  const action = btn.dataset.action;

  // Menu Rápido
  if (action === 'quiz-corte') return startQuiz('corte');
  if (action === 'quiz-cor') return startQuiz('cor');
  if (action === 'quiz-produto') return startQuiz('produto');
  if (action === 'quiz-kit') return startQuiz('kit');
  if (action === 'duvidas') return showDuvidasMenu();
  
  // Respostas do Quiz
  if (action.startsWith('opt-') && state.mode === 'quiz') {
    const idx = parseInt(action.split('-')[1]);
    const val = QUIZZES[state.quiz].perguntas[state.step].opcoes[idx].v;
    state.answers.push(val);
    state.step++;
    
    // Desabilita botões da pergunta anterior para não clicar de novo
    btn.closest('.options').querySelectorAll('button').forEach(b => b.disabled = true);
    
    setTimeout(askNextQuestion, 500);
    return;
  }

  // Respostas de Dúvidas
  if (action.startsWith('doubt-')) {
    const idx = parseInt(action.split('-')[1]);
    addMsg(DUVIDAS[idx].a, 'bot');
    resetState(); // Limpa o estado após responder
    return;
  }
});

// Envio por texto
document.getElementById('sendBtn').addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  
  addMsg(text, 'user');
  inputEl.value = '';
  
  // Se estiver no meio de um quiz, ignora texto livre (ou poderia tratar, mas aqui focamos nos botões)
  if (state.mode === 'quiz') return;

  // Match simples de intenções
  const lower = text.toLowerCase();
  if (lower.includes('corte')) return startQuiz('corte');
  if (lower.includes('cor') || lower.includes('mecha') || lower.includes('color')) return startQuiz('cor');
  if (lower.includes('produto') || lower.includes('shampoo') || lower.includes('creme')) return startQuiz('produto');
  if (lower.includes('kit')) return startQuiz('kit');
  if (lower.includes('dúvida') || lower.includes('duvida') || lower.includes('ajuda') || lower.includes('dúvidas')) return showDuvidasMenu();
  
  addMsg('Posso te ajudar com um <strong>Quiz de Corte, Cor, Produto ou Kit</strong>, ou tirar suas <strong>Dúvidas</strong>. Use os botões acima ou digite o que precisa! ✨', 'bot');
}

/* ============================================================
   MENSAGEM INICIAL
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    addMsg('Olá! Sou o <strong>HairOS</strong>, seu assistente de beleza. ✦<br><br>Posso te ajudar a descobrir o corte, cor ou produto ideal através dos nossos <strong>Quizzes</strong>, ou tirar dúvidas rápidas. Como posso te ajudar hoje?', 'bot');
  }, 400);
});
</script>
