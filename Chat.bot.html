<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>HairOS · Assistente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0808;
            --surface: #12100e;
            --surface2: #1a1612;
            --gold: #c9a96e;
            --gold-dim: rgba(201, 169, 110, 0.15);
            --gold-light: #e8d5a8;
            --text: #f0ebe4;
            --text-sec: #d4c9bc;
            --muted: #8a8278;
            --border: rgba(255, 255, 255, 0.04);
            --border-gold: rgba(201, 169, 110, 0.12);
            --user: #1a1612;
            --bot: #12100e;
            --green: #3d9a6a;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg);
        }
        .header {
            flex-shrink: 0;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #8b6914);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #0a0808;
            font-weight: 700;
            flex-shrink: 0;
        }
        .header-info h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .header-info p {
            font-size: 10px;
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.04em;
            opacity: 0.6;
        }
        .header-status {
            margin-left: auto;
            font-size: 9px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .header-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }
        .chat::-webkit-scrollbar { width: 3px; }
        .chat::-webkit-scrollbar-track { background: transparent; }
        .chat::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        .msg {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn .3s ease;
            font-weight: 300;
        }
        .msg.bot:has(.result-card),
        .msg.bot:has(.consultoria-block) {
            max-width: 94%;
            padding: 8px 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }
        .msg.bot {
            align-self: flex-start;
            background: var(--bot);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--user);
            border: 1px solid var(--border-gold);
            border-bottom-right-radius: 4px;
        }
        .msg strong { color: var(--gold); font-weight: 600; }
        .user-photo {
            max-width: 150px;
            border-radius: 12px;
            border: 1px solid var(--gold);
            margin-top: 6px;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .user-photo:hover { transform: scale(1.02); }
        .result-card {
            margin-top: 10px;
            background: var(--surface2);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .result-card:hover {
            border-color: rgba(201, 169, 110, 0.35);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
        .result-hero {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 220px;
            overflow: hidden;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-hero img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            transition: transform 0.6s cubic-bezier(.25, .46, .45, .94);
            cursor: pointer;
            background: var(--surface2);
        }
        .result-card:hover .result-hero img { transform: scale(1.04); }
        .result-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                rgba(10, 8, 8, 0) 45%,
                rgba(10, 8, 8, 0.30) 70%,
                rgba(10, 8, 8, 0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }
        .result-hero-info {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 2;
            text-align: left;
        }
        .result-hero-info .badge {
            display: inline-block;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid rgba(201, 169, 110, 0.25);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .result-hero-info h3 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.15;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            margin: 0;
        }
        .result-hero-info .subtitle {
            font-size: 0.65rem;
            color: var(--text-sec);
            opacity: 0.85;
            font-weight: 300;
            margin-top: 2px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
        }
        .result-body {
            padding: 10px 12px;
        }
        .result-body p {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.5;
            font-weight: 300;
            margin-bottom: 10px;
        }
        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .result-actions a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 10px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            width: 100%;
            letter-spacing: 0.02em;
        }
        .result-actions a.btn-ml {
            background: var(--gold);
            color: #0a0808;
            border: none;
        }
        .result-actions a.btn-ml:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }
        .result-actions a.btn-vitrine {
            background: var(--surface2);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: 600;
        }
        .result-actions a.btn-vitrine:hover {
            background: var(--gold);
            color: #0a0808;
            border-color: var(--gold);
        }
        .consultoria-block { margin-top: 4px; }
        .consultoria-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--gold);
            font-size: 13px;
            margin: 14px 0 6px 0;
            letter-spacing: 0.01em;
        }
        .consultoria-title:first-child { margin-top: 4px; }
        .alt-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 2px 8px;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
        }
        .alt-scroll::-webkit-scrollbar { display: none; }
        .alt-item {
            min-width: 70px;
            max-width: 80px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            scroll-snap-align: start;
            transition: border-color 0.25s, transform 0.25s;
            position: relative;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
        .alt-item:hover {
            border-color: rgba(201, 169, 110, 0.35);
            transform: translateY(-2px);
        }
        .alt-item-img {
            width: 100%;
            height: 60px;
            object-fit: cover;
            object-position: center center;
            display: block;
            background: var(--surface2);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .alt-item-img:hover { transform: scale(1.05); }
        .alt-item span {
            display: block;
            font-size: 8.5px;
            color: var(--text-sec);
            font-weight: 500;
            padding: 4px 4px 5px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            pointer-events: none;
        }
        .mini-product {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 6px;
            transition: border-color 0.25s, transform 0.2s;
            position: relative;
            text-decoration: none;
            cursor: pointer;
        }
        .mini-product:hover {
            border-color: rgba(201, 169, 110, 0.3);
            transform: translateY(-1px);
        }
        .mini-product-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mini-product-img {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
            object-position: center center;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .mini-product-img:hover { transform: scale(1.08); }
        .mini-product-info { flex: 1; }
        .mini-product-info h4 {
            font-size: 10.5px;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 1px;
            font-family: 'Inter', sans-serif;
        }
        .mini-product-info p {
            font-size: 9px;
            color: var(--muted);
            margin: 0;
            line-height: 1.3;
            font-weight: 300;
        }
        .mini-product-actions {
            display: flex;
            gap: 5px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .mini-product-actions a {
            font-size: 9px;
            padding: 4px 12px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.03em;
            text-align: center;
            flex: 1;
            min-width: 70px;
        }
        .mini-product-actions a.btn-ml-mini {
            background: var(--gold);
            color: #0a0808;
            border: none;
        }
        .mini-product-actions a.btn-ml-mini:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }
        .mini-product-actions a.btn-vitrine-mini {
            background: var(--surface2);
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .mini-product-actions a.btn-vitrine-mini:hover {
            background: var(--gold);
            color: #0a0808;
        }
        .refazer-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: var(--gold);
            font-size: 10px;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 0.03em;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .refazer-link:hover { opacity: 1; }
        .quick {
            flex-shrink: 0;
            padding: 6px 12px 4px;
            display: flex;
            gap: 5px;
            overflow-x: auto;
            border-top: 1px solid var(--border);
            background: var(--surface);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .quick::-webkit-scrollbar { display: none; }
        .quick button {
            flex-shrink: 0;
            padding: 5px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 100px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.04em;
        }
        .quick button:active,
        .quick button:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--gold-dim);
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 6px;
        }
        .options button {
            text-align: left;
            padding: 8px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .options button:active,
        .options button:hover {
            border-color: var(--gold);
            background: var(--gold-dim);
            color: var(--gold);
        }
        .options button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border);
            background: transparent;
            color: var(--muted);
        }
        .composer {
            flex-shrink: 0;
            padding: 6px 10px 10px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 5px;
            align-items: flex-end;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--gold);
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:active {
            background: var(--gold-dim);
            transform: scale(0.95);
        }
        .composer textarea {
            flex: 1;
            resize: none;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 6px 12px;
            color: var(--text);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            max-height: 70px;
            outline: none;
            transition: border 0.2s;
        }
        .composer textarea:focus { border-color: var(--gold); }
        .composer textarea::placeholder {
            color: var(--muted);
            opacity: 0.4;
        }
        .composer button.send {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--gold);
            color: #0a0808;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .composer button.send:hover {
            background: var(--gold-light);
            transform: scale(1.03);
        }
        .composer button.send:active { transform: scale(0.95); }
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .chat-loading {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            transition: opacity .7s cubic-bezier(.23, 1, .32, 1), visibility .7s ease;
        }
        .chat-loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .chat-loading .loading-logo {
            font: italic 700 clamp(2.5rem, 8vw, 3.4rem)/1 'Playfair Display', serif;
            letter-spacing: -.02em;
            opacity: 0;
            transform: translateY(16px) scale(.97);
            animation: chatLoadingIn .7s cubic-bezier(.23, 1, .32, 1) forwards;
        }
        .chat-loading .loading-logo span,
        .chat-loading .loading-logo b {
            color: var(--gold);
            text-shadow: 0 0 60px var(--gold-dim);
        }
        .chat-loading .loading-track {
            width: min(210px, 64vw);
            height: 3px;
            margin-top: 28px;
            overflow: hidden;
            border-radius: 99px;
            background: var(--border);
        }
        .chat-loading .loading-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            box-shadow: 0 0 18px var(--gold-dim);
            transition: width .28s cubic-bezier(.23, 1, .32, 1);
        }
        .chat-loading p {
            margin-top: 16px;
            color: var(--muted);
            font: 300 .68rem/1.4 Inter, sans-serif;
            letter-spacing: .16em;
            text-align: center;
            text-transform: uppercase;
        }
        .chat-loading .loading-percent {
            margin-top: 6px;
            color: var(--gold);
            font: 400 .65rem/1 Inter, sans-serif;
            letter-spacing: .04em;
            opacity: .75;
        }
        @keyframes chatLoadingIn {
            from { opacity: 0; transform: translateY(16px) scale(.97); }
            to { opacity: 1; transform: none; }
        }
        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: zoom-out;
        }
        .image-modal.active { display: flex; }
        .image-modal img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid var(--border-gold);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            cursor: default;
        }
        .image-modal .close-modal {
            position: absolute;
            top: 20px;
            right: 24px;
            color: var(--text);
            font-size: 32px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .image-modal .close-modal:hover {
            background: var(--gold-dim);
            border-color: var(--gold);
        }
        .image-modal .modal-actions {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .image-modal .modal-actions a {
            padding: 8px 24px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.03em;
        }
        .image-modal .modal-actions .btn-vitrine-modal {
            background: var(--surface2);
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .image-modal .modal-actions .btn-vitrine-modal:hover {
            background: var(--gold);
            color: #0a0808;
        }
        .image-modal .modal-actions .btn-ml-modal {
            background: var(--gold);
            color: #0a0808;
            border: none;
        }
        .image-modal .modal-actions .btn-ml-modal:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }
        .image-modal .modal-title {
            position: absolute;
            top: 80px;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            text-align: center;
            max-width: 80%;
        }
        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .compare-grid .result-card {
            margin-top: 0;
        }
        .compare-grid .result-hero {
            max-height: 140px;
        }
        @media (max-width: 480px) {
            .header-info h1 { font-size: 13px; }
            .header-info p { font-size: 9px; }
            .msg { font-size: 12px; padding: 8px 12px; }
            .quick button { font-size: 9px; padding: 4px 10px; }
            .composer textarea { font-size: 12px; padding: 5px 10px; }
            .result-hero { max-height: 160px; }
            .image-modal .modal-title { font-size: 0.9rem; top: 70px; }
            .image-modal .modal-actions a { font-size: 0.7rem; padding: 6px 16px; }
            .compare-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="chat-loading" id="chatLoading">
        <div class="loading-logo">Hair<span>OS</span><b>.</b></div>
        <div class="loading-track"><div class="loading-fill" id="chatLoadingFill"></div></div>

    <script src="data.js"></script>
    <script>
        // ============================================================
        // HAIR·OS ASSISTENTE — CHAT COMPLETO
        // 100% baseado no data.js (60 estilos)
        // Inclui: Curtain Bang, links reais dos kits
        // ============================================================

        var VITRINE_URL = 'index.html';
        var ML_SEARCH = 'https://www.mercadolivre.com.br/busca?word=';

        var state = { mode: 'idle', quiz: null, step: 0, answers: [] };
        var quizTimer = null;
        var chatEl = document.getElementById('chat');
        var inputEl = document.getElementById('input');
        var photoInput = document.getElementById('photoInput');
        var cameraBtn = document.getElementById('cameraBtn');

        function escapeAttr(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
        }
        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function getItemName(item) {
            if (!item) return '';
            return item.corte || item.title || '';
        }
        function getItemSubtitle(item) {
            if (!item) return '';
            if (item.corte && item.title && item.corte !== item.title) return item.title;
            return '';
        }

        // ============================================================
        // FUNÇÃO GETMLLINK — COM LINKS REAIS DOS KITS
        // ============================================================
        function getMlLink(item) {
            if (!item) return ML_SEARCH;
            
            if (item.link) return item.link;
            
            if (typeof coloracaoKits !== 'undefined' && coloracaoKits.kits) {
                for (var i = 0; i < coloracaoKits.kits.length; i++) {
                    var kit = coloracaoKits.kits[i];
                    if (kit.link && item.title && item.title.toLowerCase().indexOf(kit.nome.toLowerCase()) !== -1) {
                        return kit.link;
                    }
                }
            }
            
            if (typeof cuidadosKits !== 'undefined' && cuidadosKits.kits) {
                for (var j = 0; j < cuidadosKits.kits.length; j++) {
                    var kitCuidado = cuidadosKits.kits[j];
                    if (kitCuidado.link && item.title && item.title.toLowerCase().indexOf(kitCuidado.nome.toLowerCase()) !== -1) {
                        return kitCuidado.link;
                    }
                }
            }
            
            var q = getItemName(item) || item.title || '';
            return ML_SEARCH + encodeURIComponent(q);
        }

        function getVitrineLink(item) {
            if (!item || !item.id) return VITRINE_URL;
            return VITRINE_URL + '?estilo=' + encodeURIComponent(item.id);
        }

        function pickAlternatives(item, categoria, count) {
            count = count || 3;
            var keys = Object.keys(styleData).filter(function (k) {
                return styleData[k] && styleData[k].categoria === categoria &&
                    styleData[k].id !== item.id && !String(k).startsWith('user_');
            });
            for (var i = keys.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = keys[i]; keys[i] = keys[j]; keys[j] = t;
            }
            return keys.slice(0, count).map(function (k) { return styleData[k]; });
        }

        function buscarPorPalavra(palavra) {
            var results = [];
            var lower = palavra.toLowerCase();
            Object.keys(styleData).forEach(function (k) {
                var item = styleData[k];
                if (String(k).startsWith('user_')) return;
                var name = getItemName(item).toLowerCase();
                var desc = (item.desc || '').toLowerCase();
                var sub = (getItemSubtitle(item) || '').toLowerCase();
                if (name.indexOf(lower) !== -1 || desc.indexOf(lower) !== -1 || sub.indexOf(lower) !== -1) {
                    results.push(item);
                }
            });
            return results;
        }

        // ============================================================
        // MOTOR DE RECOMENDAÇÃO — ATUALIZADO COM CURTAIN BANG
        // ============================================================
        var MotorRecomendacao = {
            poolsCorte: {
                curto: ['pixie-cut', 'bixie-cut', 'french-bob', 'modern-mullet', 'curtain-bang'],
                medio: ['long-bob', 'italian-bob', 'blunt-cut', 'wolf-cut', 'shaggy-hair', 'clavicut', 'velvet-bob'],
                longo: ['butterfly-cut', 'hush-cut', 'octopus-cut', 'clavicut']
            },
            texturaCorte: {
                'pixie-cut': ['liso', 'ondulado', 'cacheado'],
                'bixie-cut': ['liso', 'ondulado'],
                'french-bob': ['liso', 'ondulado'],
                'modern-mullet': ['ondulado', 'cacheado', 'liso'],
                'long-bob': ['liso', 'ondulado'],
                'italian-bob': ['liso', 'ondulado'],
                'blunt-cut': ['liso'],
                'wolf-cut': ['ondulado', 'cacheado'],
                'shaggy-hair': ['ondulado', 'cacheado', 'liso'],
                'clavicut': ['liso', 'ondulado'],
                'velvet-bob': ['liso', 'ondulado'],
                'butterfly-cut': ['ondulado', 'cacheado', 'liso'],
                'hush-cut': ['liso', 'ondulado'],
                'octopus-cut': ['ondulado', 'cacheado'],
                'curtain-bang': ['liso', 'ondulado', 'cacheado']
            },
            tempoBaixo: ['pixie-cut', 'bixie-cut', 'blunt-cut', 'clavicut', 'french-bob', 'long-bob', 'curtain-bang'],
            tempoAlto: ['wolf-cut', 'shaggy-hair', 'octopus-cut', 'modern-mullet', 'butterfly-cut', 'hush-cut'],
            estiloClassico: ['french-bob', 'blunt-cut', 'long-bob', 'clavicut', 'italian-bob'],
            estiloModerno: ['pixie-cut', 'bixie-cut', 'velvet-bob', 'butterfly-cut', 'hush-cut', 'wolf-cut', 'curtain-bang'],
            estiloAlternativo: ['modern-mullet', 'wolf-cut', 'shaggy-hair', 'octopus-cut', 'bixie-cut'],

            resolverCorte: function (comp, tex, tempo, estilo) {
                comp = comp || 'medio';
                tex = tex || 'liso';
                tempo = tempo || 'medio';
                estilo = estilo || 'moderno';
                var pool = (this.poolsCorte[comp] || this.poolsCorte.medio).slice();
                var porTex = pool.filter(function (id) {
                    var ok = MotorRecomendacao.texturaCorte[id];
                    return ok && ok.indexOf(tex) !== -1;
                });
                if (porTex.length) pool = porTex;
                if (tempo === 'baixo') {
                    var tB = pool.filter(function (id) { return MotorRecomendacao.tempoBaixo.indexOf(id) !== -1; });
                    if (tB.length) pool = tB;
                } else if (tempo === 'alto') {
                    var tA = pool.filter(function (id) { return MotorRecomendacao.tempoAlto.indexOf(id) !== -1; });
                    if (tA.length) pool = tA;
                }
                var listaEstilo = estilo === 'classico' ? this.estiloClassico
                    : estilo === 'alternativo' ? this.estiloAlternativo
                    : this.estiloModerno;
                var porEstilo = pool.filter(function (id) { return listaEstilo.indexOf(id) !== -1; });
                if (porEstilo.length) pool = porEstilo;
                if (!pool.length) {
                    if (comp === 'curto') return 'pixie-cut';
                    if (comp === 'longo') return 'butterfly-cut';
                    return 'long-bob';
                }
                return pool[0];
            },

            resolverCor: function (base, manut, resultado) {
                base = base || 'castanho';
                manut = manut || 'media';
                resultado = resultado || 'natural';
                if (base === 'grisalho') {
                    if (resultado === 'marcante') return 'grisalhos-quentes';
                    return 'grisalhos-frios';
                }
                if (base === 'ruivo') {
                    if (resultado === 'marcante') return 'cherry-cola';
                    if (resultado === 'natural') return 'ruivo-doce-leite';
                    return 'cowgirl-copper';
                }
                if (base === 'loiro') {
                    if (resultado === 'natural') {
                        return manut === 'baixa' ? 'californianas' : 'balayage-loira';
                    }
                    if (resultado === 'marcante') {
                        return manut === 'alta' ? 'ombre-tiger-eye' : 'highlights-loira';
                    }
                    return manut === 'baixa' ? 'vanilla-blonde' : 'contour-highlights';
                }
                if (base === 'escuro') {
                    if (resultado === 'marcante') return manut === 'alta' ? 'ombre-tiger-eye' : 'cherry-cola';
                    if (resultado === 'uniforme' || resultado === 'sofisticado') return 'mocha-mousse';
                    return manut === 'baixa' ? 'babylights-morena' : 'mechas-contour';
                }
                if (resultado === 'natural') {
                    return manut === 'baixa' ? 'expensive-brunette' : 'babylights-morena';
                }
                if (resultado === 'marcante') {
                    return manut === 'alta' ? 'ombre-tiger-eye' : 'contour-highlights';
                }
                return manut === 'baixa' ? 'mocha-mousse' : 'mechas-contour';
            },

            resolverProduto: function (queixa, colora, textura) {
                queixa = queixa || 'seco';
                colora = colora || 'nao';
                textura = textura || 'liso';
                if (queixa === 'cor' || (colora === 'sim' && queixa === 'seco')) return 'expert-vitamino-color';
                if (queixa === 'cor') return 'joico-color-endure';
                if (queixa === 'danificado') {
                    return colora === 'sim' ? 'expert-absolut-repair-mask' : 'kerastase-resistance-mask';
                }
                if (queixa === 'cacho' || textura === 'cacheado') return 'joico-moisture-mask';
                if (queixa === 'quebra') return 'joico-defy-damage';
                if (queixa === 'opaco') return 'kerastase-chronologiste-oil';
                if (queixa === 'calor') return 'kerastase-thermique';
                if (queixa === 'metal' || queixa === 'pre_color') return 'expert-metal-detox';
                if (queixa === 'seco') return 'joico-moisture-shampoo';
                return 'kerastase-resistance-shampoo';
            },

            resolverKit: function (foco, queixa) {
                foco = foco || 'premium';
                queixa = queixa || 'geral';
                if (foco === 'coloracao') {
                    if (queixa === 'danificado') return 'kit-expert-absolut-repair';
                    if (queixa === 'metal') return 'kit-expert-metal-detox';
                    return 'kit-expert-vitamino-color';
                }
                if (foco === 'hidro') {
                    if (queixa === 'intenso') return 'kit-joico-moisture-mask';
                    return 'kit-joico-moisture';
                }
                if (foco === 'recon') {
                    if (queixa === 'intenso') return 'kit-expert-absolut-repair-mask';
                    return 'kit-expert-absolut-repair';
                }
                if (foco === 'volume') return 'kit-joico-Volumizing';
                if (foco === 'protecao') return 'kit-joico-defy-damage';
                if (foco === 'brilho') return 'kit-expert-serum';
                if (foco === 'termico') return 'kit-kerastase-thermique';
                if (queixa === 'hidro') return 'kit-kerastase-hydration';
                if (queixa === 'regeneracao') return 'kit-kerastase-chronologiste';
                return 'kit-kerastase-resistance';
            }
        };

        // ============================================================
        // ANALISADOR DE IMAGEM
        // ============================================================
        var AnalisadorImagem = {
            extrairCoresDominantes: function (imgElement, numCores) {
                numCores = numCores || 5;
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var width = 150, height = 150;
                canvas.width = width;
                canvas.height = height;
                try { ctx.drawImage(imgElement, 0, 0, width, height); } catch (e) { return []; }
                var imageData = ctx.getImageData(0, 0, width, height);
                var data = imageData.data;
                var colorMap = {};
                var step = 4;
                for (var y = 0; y < height; y += step) {
                    for (var x = 0; x < width; x += step) {
                        var idx = (y * width + x) * 4;
                        if (data[idx + 3] < 128) continue;
                        var r = Math.round(data[idx] / 16) * 16;
                        var g = Math.round(data[idx + 1] / 16) * 16;
                        var b = Math.round(data[idx + 2] / 16) * 16;
                        var key = r + ',' + g + ',' + b;
                        colorMap[key] = (colorMap[key] || 0) + 1;
                    }
                }
                var sorted = Object.keys(colorMap).sort(function (a, b) { return colorMap[b] - colorMap[a]; });
                var result = [];
                for (var j = 0; j < Math.min(numCores, sorted.length); j++) {
                    var parts = sorted[j].split(',').map(Number);
                    result.push({ r: parts[0], g: parts[1], b: parts[2], freq: colorMap[sorted[j]] });
                }
                return result;
            },
            classificarCorCabelo: function (cores) {
                if (!cores || !cores.length) return 'castanho';
                var filtradas = cores.filter(function (c) {
                    var media = (c.r + c.g + c.b) / 3;
                    var sat = Math.abs(c.r - media) + Math.abs(c.g - media) + Math.abs(c.b - media);
                    return sat < 140 && media > 15 && media < 245;
                });
                if (!filtradas.length) filtradas = cores;
                var cor = filtradas[0];
                var media = (cor.r + cor.g + cor.b) / 3;
                var sat = Math.abs(cor.r - media) + Math.abs(cor.g - media) + Math.abs(cor.b - media);
                if (sat < 40 && media > 90 && media < 200) return 'grisalho';
                if (cor.r >= 170 && cor.g >= 140 && cor.b >= 100) return 'loiro';
                if (cor.r >= 140 && cor.g >= 60 && cor.g <= 160 && cor.b <= 100) return 'ruivo';
                if (cor.r < 55 && cor.g < 55 && cor.b < 55) return 'escuro';
                return 'castanho';
            },
            estimarComprimento: function (imgElement) {
                var w = imgElement.naturalWidth || imgElement.width || 0;
                var h = imgElement.naturalHeight || imgElement.height || 0;
                if (!w || !h) return 'medio';
                var ratio = h / w;
                if (ratio > 2.2) return 'longo';
                if (ratio > 1.35) return 'medio';
                return 'curto';
            },
            estimarTextura: function (imgElement) {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var width = 160, height = 160;
                canvas.width = width;
                canvas.height = height;
                try { ctx.drawImage(imgElement, 0, 0, width, height); } catch (e) { return 'liso'; }
                var data = ctx.getImageData(0, 0, width, height).data;
                var soma = 0, total = 0, variacoes = [];
                for (var y = 2; y < height - 2; y += 2) {
                    for (var x = 2; x < width - 2; x += 2) {
                        var idx = (y * width + x) * 4;
                        var brilho = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        var diffs = [];
                        for (var dy = -1; dy <= 1; dy++) {
                            for (var dx = -1; dx <= 1; dx++) {
                                if (!dx && !dy) continue;
                                var iv = ((y + dy) * width + (x + dx)) * 4;
                                var bv = (data[iv] + data[iv + 1] + data[iv + 2]) / 3;
                                diffs.push(Math.abs(brilho - bv));
                            }
                        }
                        var dm = diffs.reduce(function (a, b) { return a + b; }, 0) / diffs.length;
                        soma += dm;
                        variacoes.push(dm);
                        total++;
                    }
                }
                if (!total) return 'liso';
                variacoes.sort(function (a, b) { return a - b; });
                var score = (soma / total + variacoes[Math.floor(variacoes.length / 2)]) / 2;
                if (score > 55) return 'cacheado';
                if (score > 32) return 'ondulado';
                return 'liso';
            },
            analisar: function (imgElement) {
                var cores = this.extrairCoresDominantes(imgElement, 6);
                var cor = this.classificarCorCabelo(cores);
                var comprimento = this.estimarComprimento(imgElement);
                var textura = this.estimarTextura(imgElement);
                return {
                    cor: cor,
                    comprimento: comprimento,
                    textura: textura,
                    sugestaoCorte: MotorRecomendacao.resolverCorte(comprimento, textura, 'medio', 'moderno'),
                    sugestaoCor: MotorRecomendacao.resolverCor(cor, 'media', 'natural')
                };
            }
        };

        // ============================================================
        // UI HELPERS
        // ============================================================
        function addMsg(text, sender, extraHtml) {
            extraHtml = extraHtml || '';
            if (!chatEl) return;
            var div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.innerHTML = text + (extraHtml ? ' ' + extraHtml : '');
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function showTyping() {
            var div = document.createElement('div');
            div.className = 'msg bot';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            var el = document.getElementById('typingIndicator');

        function resetState() {
            if (quizTimer) { clearTimeout(quizTimer); quizTimer = null; }
            state.mode = 'idle';
            state.quiz = null;
            state.step = 0;
            state.answers = [];

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(src, title, vitrineLink, mlLink) {
            var modal = document.getElementById('imageModal');
            var img = document.getElementById('modalImg');
            var titleEl = document.getElementById('modalTitle');
            var vitrineBtn = document.getElementById('modalVitrineLink');

            if (vitrineBtn) vitrineBtn.href = vitrineLink || VITRINE_URL;

            document.body.style.overflow = 'hidden';

            var modal = document.getElementById('imageModal');
            if (modal) {
                modal.classList.remove('active');
                document.body.style.overflow = '';

        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
        window.openModal = openModal;
        window.closeModal = closeModal;

        // ============================================================
        // BUILDERS DE UI
        // ============================================================
        function buildMainCard(item, label) {
            if (!item) return '';

            var sub = getItemSubtitle(item);
            var vitrine = getVitrineLink(item);

            var html = '<div class="result-card" data-id="' + escapeAttr(item.id) + '">';

            html += '<img src="' + escapeHtml(img) + '" alt="' + escapeHtml(name) + '" onclick="event.stopPropagation(); openModal(this.src, \'' +
                escapeAttr(name) + '\', \'' + escapeAttr(vitrine) + '\', \'' + escapeAttr(ml) + '\')">';
            html += '<div class="result-hero-overlay"></div>';
            html += '<div class="result-hero-info">';

            html += '<h3>' + escapeHtml(name) + '</h3>';
            if (sub) html += '<div class="subtitle">' + escapeHtml(sub) + '</div>';
            html += '</div></div>';
            html += '<div class="result-body">';
            html += '<p>' + escapeHtml(item.desc || '') + '</p>';
            html += '<div class="result-actions" onclick="event.stopPropagation();">';
            html += '<a href="' + escapeHtml(vitrine) + '" class="btn-vitrine" target="_blank" rel="noopener">Ver na Vitrine</a>';
            html += '<a href="' + escapeHtml(ml) + '" class="btn-ml" target="_blank" rel="noopener">Ver no Mercado Livre</a>';
            html += '</div></div></div>';
            return html;
        }

        function buildAlternativas(items) {
            if (!items || !items.length) return '';
            var html = '<div class="alt-scroll">';
            items.forEach(function (item) {
                if (!item) return;
                var name = getItemName(item);

        function buildMiniProduct(item) {
            if (!item) return '';

            var ml = getMlLink(item);

            html += '<a href="' + escapeHtml(ml) + '" class="btn-ml-mini" target="_blank" rel="noopener">Ver no Mercado Livre</a>';
            html += '</div></div>';

        }

        function gerarResultadoCompleto(item, label, categoria) {
            var html = '<div class="consultoria-title">' + escapeHtml(label) + '</div>';
            html += buildMainCard(item, label);

        }

        // ============================================================
        // LOADING E INICIALIZAÇÃO
        // ============================================================
        function initChatLoading() {
            var overlay = document.getElementById('chatLoading');
            var fill = document.getElementById('chatLoadingFill');
            var percent = document.getElementById('chatLoadingPercent');
            var label = document.getElementById('chatLoadingText');
            if (!overlay) return;
            var steps = [
                [20, 'Preparando sua conversa'],
                [40, 'Carregando 60 estilos'],
                [60, 'Conectando quizzes'],
                [80, 'Diagnóstico e busca prontos'],
                [100, 'Assistente pronto']
            ];
            var index = 0;
            var advance = function () {
                var step = steps[index++];
                if (!step) return;
                if (fill) fill.style.width = step[0] + '%';
                if (percent) percent.textContent = step[0] + '%';
                if (label) label.textContent = step[1];
                if (index < steps.length) setTimeout(advance, 180);
                else setTimeout(function () { overlay.classList.add('hidden'); }, 280);
            };
            advance();
        }

        function initApp() {
            if (typeof styleData === 'undefined' || !styleData || Object.keys(styleData).length === 0) {
                addMsg(
                    'Não foi possível carregar os estilos. Coloque o <strong>data.js</strong> na mesma pasta deste chat.',
                    'bot'
                );
                return;
            }
            var total = Object.keys(styleData).filter(function (k) {
                return !String(k).startsWith('user_');
            }).length;
            addMsg(
                '👋 Olá! Sou o <strong>HairOS Assistente</strong> · ' + total + ' estilos no catálogo.<br><br>' +
                '🎯 <strong>Como posso ajudar:</strong><br>' +
                '• <strong>Cortes</strong> — quiz para encontrar o corte ideal (inclui <strong>Curtain Bang</strong>)<br>' +
                '• <strong>Cores</strong> — quiz para escolher a cor perfeita<br>' +
                '• <strong>Produtos</strong> — quiz para recomendar um produto específico<br>' +
                '• <strong>Kits</strong> — quiz para recomendar um kit completo<br>' +
                '• <strong>Diagnóstico</strong> — avaliação para recomendar um kit<br>' +
                '• <strong>Dúvidas</strong> — perguntas frequentes sobre o catálogo<br><br>' +
                'Envie uma <strong>foto</strong> ou digite sua dúvida!',
                'bot'
            );
        }

        window.addEventListener('DOMContentLoaded', function () {
            initChatLoading();
            initApp();
        });
    </script>
</body>
</html>
