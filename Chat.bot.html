<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairOS · Assistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0808;
      --surface: #12100e;
      --surface2: #1a1612;
      --gold: #c9a96e;
      --gold-dim: rgba(201,169,110,0.15);
      --gold-light: #e8d5a8;
      --text: #f0ebe4;
      --text-sec: #d4c9bc;
      --muted: #8a8278;
      --border: rgba(255,255,255,0.04);
      --border-gold: rgba(201,169,110,0.12);
      --user: #1a1612;
      --bot: #12100e;
      --green: #3d9a6a;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      flex-shrink: 0;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8b6914);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #0a0808;
      font-weight: 700;
    }
    .header-info h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .header-info p {
      font-size: 11px;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.04em;
      opacity: 0.6;
    }
    .header-status {
      margin-left: auto;
      font-size: 10px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .header-status::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .header-link {
      margin-left: 6px;
      font-size: 11px;
      color: var(--gold);
      text-decoration: none;
      padding: 5px 14px;
      border: 1px solid var(--border-gold);
      border-radius: 100px;
      white-space: nowrap;
      transition: all 0.3s;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-family: 'Inter', sans-serif;
    }
    .header-link:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar {
      width: 3px;
    }
    .chat::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }
    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn .3s ease;
      font-weight: 300;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid var(--border-gold);
      border-bottom-right-radius: 4px;
    }
    .msg strong {
      color: var(--gold);
      font-weight: 600;
    }
    
    .result-card {
      margin-top: 10px;
      background: var(--surface2);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      overflow: hidden;
    }
    .result-card .body { padding: 14px; }
    .result-card .badge {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gold);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .result-card h3 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      margin-bottom: 6px;
      color: var(--text);
    }
    .result-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.5;
      font-weight: 300;
    }
    .result-card .result-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .result-card a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      width: 100%;
    }
    .result-card a.btn-ml {
      background: var(--gold);
      color: #0a0808;
      border: none;
    }
    .result-card a.btn-ml:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--gold-dim);
    }
    .result-card a.btn-vitrine {
      background: var(--surface2);
      border: 1px solid var(--border-gold);
      color: var(--gold);
    }
    .result-card a.btn-vitrine:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .quick {
      flex-shrink: 0;
      padding: 10px 12px 6px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid var(--border);
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .quick::-webkit-scrollbar {
      display: none;
    }
    .quick button {
      flex-shrink: 0;
      padding: 7px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.04em;
    }
    .quick button:active,
    .quick button:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-dim);
    }
    
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .options button {
      text-align: left;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .options button:active,
    .options button:hover {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
    }
    .options button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--border);
      background: transparent;
      color: var(--muted);
    }

    .composer {
      flex-shrink: 0;
      padding: 10px 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      max-height: 100px;
      outline: none;
      transition: border 0.2s;
    }
    .composer textarea:focus {
      border-color: var(--gold);
    }
    .composer textarea::placeholder {
      color: var(--muted);
      opacity: 0.4;
    }
    .composer button.send {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--gold);
      color: #0a0808;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .composer button.send:hover {
      background: var(--gold-light);
      transform: scale(1.03);
    }
    .composer button.send:active {
      transform: scale(0.95);
    }

    .chat {
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
    }

    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      animation: typingBounce 1.4s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
    /* ===== LOADING DO ASSISTENTE ===== */
    .chat-loading { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); color: var(--text); transition: opacity .7s cubic-bezier(.23,1,.32,1), visibility .7s ease; }
    .chat-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .chat-loading .loading-logo { font: italic 700 clamp(2.5rem, 8vw, 3.4rem)/1 'Playfair Display', serif; letter-spacing: -.02em; opacity: 0; transform: translateY(16px) scale(.97); animation: chatLoadingIn .7s cubic-bezier(.23,1,.32,1) forwards; }
    .chat-loading .loading-logo span, .chat-loading .loading-logo b { color: var(--gold); text-shadow: 0 0 60px var(--gold-dim); }
    .chat-loading .loading-track { width: min(210px, 64vw); height: 3px; margin-top: 28px; overflow: hidden; border-radius: 99px; background: var(--border); }
    .chat-loading .loading-fill { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--gold-light)); box-shadow: 0 0 18px var(--gold-dim); transition: width .28s cubic-bezier(.23,1,.32,1); }
    .chat-loading p { margin-top: 16px; color: var(--muted); font: 300 .68rem/1.4 Inter, sans-serif; letter-spacing: .16em; text-align: center; text-transform: uppercase; }
    .chat-loading .loading-percent { margin-top: 6px; color: var(--gold); font: 400 .65rem/1 Inter, sans-serif; letter-spacing: .04em; opacity: .75; }
    @keyframes chatLoadingIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .chat-loading .loading-logo { animation: none; opacity: 1; transform: none; } .chat-loading .loading-fill { transition: none; } }
  </style>
</head>

  cor: {

      { q: 'Quanto de manutenção você aceita?', opcoes: [{ t: 'Baixa (retoca pouco)', v: 'baixa' }, { t: 'Média', v: 'media' }, { t: 'Alta (topo de loiro/platinado)', v: 'alta' }] },
      { q: 'Qual resultado você busca?', opcoes: [{ t: 'Natural, como no sol', v: 'natural' }, { t: 'Marcante, com contraste', v: 'marcante' }, { t: 'Sofisticado e uniforme', v: 'uniforme' }] },
      { q: 'Tom de pele aproximado?', opcoes: [{ t: 'Frio (rosado / azeitonado)', v: 'frio' }, { t: 'Quente (dourado / pêssego)', v: 'quente' }, { t: 'Neutro', v: 'neutro' }] },
    ],

      if (a[0] === 'loiro' && a[2] === 'natural') return 'californianas';
      if (a[0] === 'loiro' && a[2] === 'uniforme') return 'vanilla-blonde';
      if (a[0] === 'loiro') return 'balayage';
      if (a[0] === 'ruivo' || (a[3] === 'quente' && a[2] === 'marcante')) return 'copper-hair';
      if (a[2] === 'marcante' && a[3] === 'frio') return 'cherry-cola';
      if (a[0] === 'castanho' && a[2] === 'natural') return 'morena-iluminada';
      if (a[0] === 'castanho' && a[3] === 'frio') return 'mocha-mousse';
      if (a[0] === 'castanho' && a[1] === 'media') return 'caramelo-glow';
      if (a[0] === 'escuro' && a[3] === 'quente') return 'expensive-brunette';
      if (a[0] === 'escuro' && a[3] === 'frio') return 'mushroom-brown';

      { q: 'Você faz coloração com frequência?', opcoes: [{ t: 'Sim', v: 'sim' }, { t: 'Às vezes', v: 'asvezes' }, { t: 'Não', v: 'nao' }] },
      { q: 'Usa chapinha, secador ou babyliss?', opcoes: [{ t: 'Todo dia / quase todo dia', v: 'muito' }, { t: 'Às vezes', v: 'medio' }, { t: 'Raramente', v: 'pouco' }] },
      { q: 'Prefere rotina simples ou tratamento semanal?', opcoes: [{ t: 'Simples (shampoo + cond)', v: 'simples' }, { t: 'Com máscara 1x por semana', v: 'mascara' }, { t: 'Protocolo completo', v: 'completo' }] },
    ],
    resolver(a) {
      if (a[0] === 'metais') return 'expert-metal-detox';
      if (a[0] === 'amarelo') return 'kerastase-resistance-shampoo';
      if (a[0] === 'cacho') return 'joico-moisture-shampoo';
      if (a[0] === 'queda') return 'kerastase-resistance-conditioner';
      if (a[0] === 'frizz') return 'joico-defy-damage';
      if (a[0] === 'cor' || a[1] === 'sim') return 'expert-vitamino-color';
      if (a[0] === 'danificado' || a[2] === 'muito') return 'expert-absolut-repair-shampoo';
      if (a[0] === 'seco') return 'joico-moisture-shampoo';
      return 'joico-moisture-shampoo';
    },
    tipo: 'produtos', label: 'Produto sugerido'
  },
  kit: {
    titulo: 'Quiz de Kit',
    perguntas: [
      { q: 'Qual o foco principal agora?', opcoes: [
        { t: '🎨 Coloração profissional', v: 'coloracao' },
        { t: '💧 Hidratação e reconstrução', v: 'hidro' },
        { t: '🛡️ Proteção e cuidados diários', v: 'protecao' },
        { t: '✨ Cuidado premium de luxo', v: 'premium' },
      ]},
      { q: 'Seu cabelo passou por química recente?', opcoes: [
        { t: 'Sim', v: 'sim' },
        { t: 'Não', v: 'nao' }
      ]},
      { q: 'Quantos passos você aceita na rotina?', opcoes: [
        { t: '2 (shampoo + cond)', v: '2' },
        { t: '3 (com máscara)', v: '3' },
        { t: '4+ (leave-in, óleo...)', v: '4' }
      ]},
    ],
    resolver(a) {
      if (a[0] === 'coloracao') return 'kit-loreal';
      if (a[0] === 'hidro') return 'kit-joico';
      if (a[0] === 'protecao') return 'kit-loreal-expert';
      if (a[0] === 'premium') return 'kit-kerastase';
      return 'kit-keune';
    },
    tipo: 'kits', label: 'Kit sugerido'
  }
};

// DÚVIDAS
const DUVIDAS = [
  { q: 'Como escolher o corte ideal?', a: 'O corte ideal depende do formato do seu rosto e textura. Use nosso <strong>Quiz de Corte</strong> para receber uma recomendação personalizada!' },
  { q: 'Qual cor não agride tanto o fio?', a: 'Técnicas como <strong>Balayage</strong> e <strong>Morena Iluminada</strong> agridem menos. Use o <strong>Kit L\'Oréal Expert</strong> para manter a saúde!' },
  { q: 'Os produtos são originais?', a: 'Sim! Trabalhamos apenas com distribuidores oficiais e parceiros certificados. Todos os produtos são 100% originais e lacrados.' },
  { q: 'Qual o prazo de entrega?', a: 'O prazo varia conforme sua região e é calculado diretamente no checkout, garantindo segurança e rastreio em cada etapa.' }
];

/* ============================================================
   ESTADO E CONTROLE DE FLUXO
   ============================================================ */
let state = { mode: 'idle', quiz: null, step: 0, answers: [] };
let quizTimer = null;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');

function addMsg(text, sender, extraHtml = '') {
  if (!chatEl) return;
  const div = document.createElement('div');
  div.className = `msg ${sender}`;
  div.innerHTML = `${text} ${extraHtml}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function resetState() {
  if (quizTimer) {
    clearTimeout(quizTimer);
    quizTimer = null;
  }
  state.mode = 'idle';
  state.quiz = null;
  state.step = 0;
  state.answers = [];
}

/* ============================================================
   FUNÇÃO PARA ABRIR A VITRINE E SCROLLAR ATÉ O CARD
   ============================================================ */
function openVitrineWithCard(key) {
  // Tenta chamar a função do index.html
  if (window.opener && window.opener.scrollToCard) {
    window.opener.scrollToCard('card-' + key);
    window.focus();
    return;
  }
  
  // Fallback: abre o index.html com parâmetro na URL
  const url = `index.html?card=${key}`;
  window.open(url, '_blank');
}

/* ============================================================
   FLUXO DOS QUIZZES
   ============================================================ */
function startQuiz(tipo) {
  resetState();
  state.mode = 'quiz';
  state.quiz = tipo;
  addMsg(`Vamos iniciar o <strong>${QUIZZES[tipo].titulo}</strong>! Responda as perguntas para receber sua recomendação personalizada.`, 'bot');
  quizTimer = setTimeout(() => {
    quizTimer = null;
    askNextQuestion();
  }, 600);
}

function askNextQuestion() {
  const qData = QUIZZES[state.quiz];
  if (state.step >= qData.perguntas.length) {
    const key = qData.resolver(state.answers);
    showResult(qData.tipo, key, qData.label);
    return;
  }
  const p = qData.perguntas[state.step];
  let optsHtml = '<div class="options">';
  p.opcoes.forEach((op, i) => {
    optsHtml += `<button data-action="opt-${i}">${op.t}</button>`;
  });
  optsHtml += '</div>';
  addMsg(p.q, 'bot', optsHtml);
}

/* ============================================================
   FUNÇÃO PRINCIPAL: showResult COM BOTÕES
   ============================================================ */
function showResult(tipo, key, label) {
  const item = CATALOGO[tipo][key];
  if (!item) {
    addMsg('Desculpe, não encontrei uma recomendação exata para você. Tente novamente!', 'bot');
    resetState();
    return;
  }
  
  // Verifica se tem link direto (para kits e produtos com link)
  let linkAfiliado;
  if (item.link) {
    linkAfiliado = item.link;
  } else {
    // Fallback: busca no Mercado Livre
    const mlQuery = encodeURIComponent(item.ml || item.nome);
    linkAfiliado = `https://www.mercadolivre.com.br/busca?word=${mlQuery}`;
  }
  
  // Link para a vitrine (index.html) com ancora
  const vitrineLink = `index.html#card-${key}`;
  
  // Define se mostra 2 botões (cortes e cores) ou só compra (produtos e kits)
  const isCorteOuCor = (tipo === 'cortes' || tipo === 'cores');
  
  let botoesHtml = '';
  if (isCorteOuCor) {
    botoesHtml = `
      <a href="${vitrineLink}" class="btn-vitrine" target="_blank">✨ Ver na Vitrine</a>
      <a href="${linkAfiliado}" class="btn-ml" target="_blank" rel="noopener">🛒 Ver no Mercado Livre</a>
    `;
  } else {
    botoesHtml = `
      <a href="${linkAfiliado}" class="btn-ml" target="_blank" rel="noopener">🛒 Comprar Agora</a>
    `;
  }
  
  const cardHtml = `
    <div class="result-card">
      <div class="body">
        <div class="badge">${label}</div>
        <h3>${item.nome}</h3>
        <p>${item.desc}</p>
        <div class="result-actions">
          ${botoesHtml}
        </div>
      </div>
    </div>
  `;
  
  addMsg('Encontrei a recomendação perfeita para você!', 'bot', cardHtml);
  resetState();
}

/* ============================================================
   FLUXO DE DÚVIDAS
   ============================================================ */
function showDuvidasMenu() {
  resetState();
  let html = '<div class="options">';
  DUVIDAS.forEach((d, i) => {
    html += `<button data-action="doubt-${i}">${d.q}</button>`;
  });
  html += '</div>';
  addMsg('Qual sua dúvida? Escolha uma das opções abaixo:', 'bot', html);
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  
  const action = btn.dataset.action;

  if (action === 'quiz-corte') return startQuiz('corte');
  if (action === 'quiz-cor') return startQuiz('cor');
  if (action === 'quiz-produto') return startQuiz('produto');
  if (action === 'quiz-kit') return startQuiz('kit');
  if (action === 'duvidas') return showDuvidasMenu();
  
  if (action.startsWith('opt-') && state.mode === 'quiz') {
    const idx = parseInt(action.split('-')[1], 10);
    const quiz = QUIZZES[state.quiz];
    const question = quiz && quiz.perguntas[state.step];
    if (!question || !question.opcoes[idx] || btn.disabled) return;
    const val = question.opcoes[idx].v;
    state.answers.push(val);
    state.step++;
    
    btn.closest('.options').querySelectorAll('button').forEach(b => b.disabled = true);
    
    quizTimer = setTimeout(() => {
      quizTimer = null;
      askNextQuestion();
    }, 500);
    return;
  }

  if (action.startsWith('doubt-')) {
    const idx = parseInt(action.split('-')[1], 10);
    if (!DUVIDAS[idx]) return;
    addMsg(DUVIDAS[idx].a, 'bot');
    resetState();
    return;
  }
});

const sendBtn = document.getElementById('sendBtn');
if (sendBtn) sendBtn.addEventListener('click', sendMessage);
if (inputEl) inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* ============================================================
   FUNÇÃO DE ENVIO DE MENSAGEM (COM TYPING)
   ============================================================ */
function sendMessage() {
  if (!inputEl) return;
  const text = inputEl.value.trim();
  if (!text) return;
  
  addMsg(text, 'user');
  inputEl.value = '';
  
  if (state.mode === 'quiz') return;

  showTyping();

  setTimeout(() => {
    removeTyping();
    
    const lower = text.toLowerCase();
    if (lower.includes('corte')) return startQuiz('corte');
    if (lower.includes('cor') || lower.includes('mecha') || lower.includes('color')) return startQuiz('cor');
    if (lower.includes('produto') || lower.includes('shampoo') || lower.includes('creme') || lower.includes('máscara')) return startQuiz('produto');
    if (lower.includes('kit')) return startQuiz('kit');
    if (lower.includes('duvida') || lower.includes('ajuda') || lower.includes('?') || lower.includes('como')) return showDuvidasMenu();
    
    addMsg('Posso te ajudar com um <strong>Quiz de Corte, Cor, Produto ou Kit</strong>, ou tirar suas <strong>Dúvidas</strong>. Use os botões acima ou digite o que precisa!', 'bot');
  }, 800);
}

/* ============================================================
   LOADING INICIAL DO ASSISTENTE
   ============================================================ */
function initChatLoading() {
  const overlay = document.getElementById('chatLoading');
  const fill = document.getElementById('chatLoadingFill');
  const percent = document.getElementById('chatLoadingPercent');
  const label = document.getElementById('chatLoadingText');
  if (!overlay) return;
  const steps = [
    [24, 'Preparando sua conversa'],
    [48, 'Organizando os quizzes'],
    [72, 'Carregando recomendações'],
    [100, 'Assistente pronto']
  ];
  let index = 0;
  const advance = () => {
    const step = steps[index++];
    if (!step) return;
    if (fill) fill.style.width = step[0] + '%';
    if (percent) percent.textContent = step[0] + '%';
    if (label) label.textContent = step[1];
    if (index < steps.length) setTimeout(advance, 180);
    else setTimeout(() => overlay.classList.add('hidden'), 320);
  };
  advance();
}

/* ============================================================
   MENSAGEM INICIAL
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  initChatLoading();
  setTimeout(() => {
    addMsg('Olá! Sou o <strong>HairOS</strong>, seu assistente de beleza.<br><br>Posso te ajudar a descobrir o corte, cor ou produto ideal através dos nossos <strong>Quizzes</strong>, ou tirar dúvidas rápidas. Como posso te ajudar hoje?', 'bot');
  }, 850);
});
</script>
